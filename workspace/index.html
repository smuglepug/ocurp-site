<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owen's Workspace — Tools, Games & Websites | Ocurp</title>
<meta name="description" content="The workspace: every browser tool, game and website. Everything runs on your own device — nothing is uploaded.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ocurp.com/workspace/">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"CollectionPage","name":"Owen's Workspace",
 "description":"Client-side browser tools and games that run entirely on your own device.",
 "url":"https://ocurp.com/workspace/"}
</script>
<style>
      /* Decorative fixed blobs (noise-overlay, bg-vibrant-blob) widen the
         scroll area and let the page pan sideways on a phone. */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        scroll-padding-top: 80px;
      }

  :root{--accent:#FF5F1F;--bg:#0a0a0a;--fg:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
  .wrap{width:100%;max-width:44rem;text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:.7rem;margin-bottom:1.1rem}
  .dot{width:.375rem;height:.375rem;border-radius:50%;background:var(--accent)}
  .eyebrow span:last-child{font-size:10px;font-weight:900;letter-spacing:.5em;
    text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1;letter-spacing:-.03em;font-weight:900;margin:0 0 1rem}
  p{color:rgba(255,255,255,.5);margin:0 auto 2.25rem;max-width:34rem;line-height:1.65}
  .grid{display:grid;gap:.75rem;grid-template-columns:1fr;text-align:left}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  a.card{display:block;padding:1.35rem 1.15rem;border-radius:8px;text-decoration:none;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    transition:border-color .18s ease,transform .18s ease}
  a.card:hover{border-color:rgba(255,95,31,.45);transform:translateY(-2px)}
  a.card b{display:block;font-size:.95rem;font-weight:800;margin-bottom:.3rem}
  a.card small{display:block;font-size:.72rem;color:rgba(255,255,255,.45);line-height:1.5}
  .foot{margin-top:2.25rem;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;
    color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow"><span class="dot"></span><span>The Workspace</span></div>
  <h1>Everything runs on your device.</h1>
  <p>No uploads, no account needed, no server holding your files. Pick a section to start.</p>

  <nav class="grid">
    <a class="card" href="/workspace/tools/">
      <b>Tools</b>
      <small>Converters, generators and calculators</small>
    </a>
    <a class="card" href="/workspace/games/">
      <b>Games</b>
      <small>Playable in the browser, no install</small>
    </a>
    <a class="card" href="/workspace/websites/">
      <b>Websites</b>
      <small>Projects built and shipped</small>
    </a>
  </nav>

  <p class="foot">Owen Osayi</p>
</main>
</body>
</html>
