<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Tables to Excel | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">PDF Tables to Excel</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">PDF & Documents — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">PDF</span><span class="ws-chip">CSV</span><span class="ws-chip">EXTRACT</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <div id="drop" class="rounded-xl border-2 border-dashed border-white/10 p-8 text-center transition-colors">
      <p class="ws-label">Drop a PDF or click to upload</p>
      <input id="file" type="file" accept="application/pdf" class="hidden">
      <p class="mt-2 text-xs text-white/30">Extracts table-like rows from PDF text into XLSX or CSV — all in your browser.</p>
    </div>
    <div id="fileInfo" class="mt-4 hidden"></div>
    <div class="mt-4 flex flex-wrap gap-3 items-end">
      <div><label class="ws-label mb-2 block">Output</label>
      <select id="fmt" class="ws-input !w-32">
        <option value="xlsx" selected>XLSX</option>
        <option value="csv">CSV</option>
      </select></div>
      <label class="flex items-center gap-1 text-xs text-white/40 mt-2"><input id="perpage" type="checkbox" class="accent-[#FF5F1F]"> One sheet per page</label>
      <label class="flex items-center gap-1 text-xs text-white/40 mt-2"><input id="allrows" type="checkbox" class="accent-[#FF5F1F]"> Keep all rows</label>
      <button id="go" class="ws-btn" disabled>Extract & Preview</button>
      <button id="dl" class="ws-btn-ghost" disabled>Download</button>
    </div>
    <div id="status" class="mt-4 text-sm"></div>
    <div class="mt-4">
      <label class="ws-label mb-2 block">Preview (first 20 rows)</label>
      <div id="preview" class="ws-panel ws-copy mt-2 p-4 overflow-auto max-h-[400px]"></div>
    </div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>function cp(b){const t=document.getElementById('out').textContent;navigator.clipboard.writeText(t);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1200)}
const $=id=>document.getElementById(id);
const drop=$('drop'),fileInput=$('file');
let fileBytes=null,fileName='output';
let csvData='';
drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('border-accent/40')});
drop.addEventListener('dragleave',()=>drop.classList.remove('border-accent/40'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('border-accent/40');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0])});
async function handleFile(f){
  fileBytes=await f.arrayBuffer();fileName=f.name.replace(/\.pdf$/i,'');
  $('fileInfo').classList.remove('hidden');
  $('fileInfo').innerHTML='<div class="rounded-xl border border-white/10 bg-white/0.04 p-4 flex items-center justify-between"><span class="ws-out">'+f.name+' — '+(f.size/1024).toFixed(1)+' KB</span><button id="clear" class="ws-btn-ghost !px-3 !py-1.5">Clear</button></div>';
  $('clear').onclick=()=>{fileBytes=null;$('fileInfo').classList.add('hidden');$('go').disabled=true;$('preview').textContent='';$('dl').disabled=true;$('status').textContent=''};
  $('go').disabled=false;
}
function escapeCsv(v){v=String(v==null?'':v);if(/[,"\n]/.test(v))return '"'+v.replace(/"/g,'""')+'"';return v;}
function csvTable(csv){
  const rows=csv.split('\n').filter(r=>r.trim());
  return rows.map(r=>r.split(','));
}
$('go').onclick=async()=>{
  if(!fileBytes)return;
  $('status').textContent='Extracting text...';
  $('go').disabled=true;
  try{
    const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.mjs';
    const pdf=await pdfjs.getDocument({data:fileBytes}).promise;
    let allRows=[];
    let pageSheets=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      // Group text items into rows by Y position
      const yMap={};
      content.items.forEach(it=>{
        if(!it.str||!it.str.trim())return;
        const y=Math.round(it.transform[5]/3)*3;
        if(!yMap[y])yMap[y]=[];
        yMap[y].push({x:it.transform[4],w:it.width||it.str.length*4,text:it.str});
      });
      const sortedYs=Object.keys(yMap).map(Number).sort((a,b)=>b-a); // top to bottom (PDF coords)
      // Detect column boundaries from X positions across all rows
      let xPositions=[];
      sortedYs.forEach(y=>{
        yMap[y].forEach(it=>{
          xPositions.push({x:it.x,w:it.w});
        });
      });
      // Cluster X positions into columns (gap-based)
      xPositions.sort((a,b)=>a.x-b.x);
      let cols=[];
      if(xPositions.length>0){
        let current={minX:xPositions[0].x,maxX:xPositions[0].x+xPositions[0].w};
        for(let j=1;j<xPositions.length;j++){
          const xp=xPositions[j];
          if(xp.x-current.maxX<15){ // same column cluster
            current.maxX=Math.max(current.maxX,xp.x+xp.w);
          }else{
            cols.push(current);
            current={minX:xp.x,maxX:xp.x+xp.w};
          }
        }
        cols.push(current);
      }
      // Assign each text item to a column
      let pageRows=[];
      sortedYs.forEach(y=>{
        yMap[y].sort((a,b)=>a.x-b.x);
        if(cols.length>1){
          // Multi-column: assign each item to nearest column
          const rowArr=new Array(cols.length).fill('');
          yMap[y].forEach(it=>{
            let bestCol=0,bestDist=Infinity;
            for(let c=0;c<cols.length;c++){
              const colCenter=(cols[c].minX+cols[c].maxX)/2;
              const dist=Math.abs(it.x-colCenter);
              if(dist<bestDist){bestDist=dist;bestCol=c}
            }
            rowArr[bestCol]+=(rowArr[bestCol]?' ':'')+it.text;
          });
          pageRows.push(rowArr);
        }else{
          // Single column: just join text
          pageRows.push([yMap[y].map(it=>it.text).join(' ')]);
        }
      });
      pageSheets.push(pageRows);
      allRows=allRows.concat(pageRows);
    }
    // No delimiter splitting needed — columns already detected structurally
    const keepAll=$('allrows').checked;
    let csvRows=allRows.map(r=>r.map(c=>c.trim()).filter(c=>c));
    if(!keepAll)csvRows=csvRows.filter(r=>r.length>1);
    csvData=csvRows.map(r=>r.map(escapeCsv).join(',')).join('\n');
    const table=csvRows.slice(0,20);
    let html='<table class="ws-out text-xs">';
    table.forEach((row,i)=>{
      html+='<tr>';
      row.forEach(cell=>{html+='<td class="border border-white/5 px-2 py-1">'+(cell||'&nbsp;')+'</td>'});
      html+='</tr>';
    });
    html+='</table>';
    $('preview').innerHTML='<div class="overflow-auto">'+html+'</div>';
    const fmt=$('fmt').value;
    $('status').textContent='✓ '+csvRows.length+' rows, '+(csvRows[0]?csvRows[0].length:0)+' columns extracted from '+pdf.numPages+' pages. Format: '+fmt.toUpperCase();
    $('status').style.color='#4ade80';
    $('dl').disabled=false;
    // store for xlsx
    window._csvRows=csvRows;window._pageSheets=pageSheets;
  }catch(e){
    $('status').textContent='✗ '+e.message;
    $('status').style.color='#f87171';
  }
  $('go').disabled=false;
};
$('dl').onclick=async()=>{
  const fmt=$('fmt').value;
  if(fmt==='xlsx'){
    try{
      const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js');
      const wb=XLSX.utils.book_new();
      if($('perpage').checked&&window._pageSheets){
        window._pageSheets.forEach((pageRows,idx)=>{
          const rows=$('allrows').checked?pageRows:pageRows.filter(r=>r.length>1);
          if(rows.length>0){
            const wsData=rows.map(r=>r.map(c=>c||''));
            const ws=XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb,ws,'Page '+(idx+1));
          }
        });
        if(wb.SheetNames.length===0){
          const ws=XLSX.utils.aoa_to_sheet([['No table data found']]);
          XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
        }
      } else {
        const rows=window._csvRows||[];
        const wsData=rows.map(r=>r.map(c=>c||''));
        const ws=XLSX.utils.aoa_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb,ws,'Table');
      }
      XLSX.writeFile(wb,fileName+'.xlsx');
    }catch(e){
      const blob=new Blob([csvData],{type:'text/csv'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName+'.csv';a.click();
    }
  }else{
    if(!csvData)return;
    const blob=new Blob([csvData],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName+'.csv';a.click();
  }
};
</script>
</body>
</html>
