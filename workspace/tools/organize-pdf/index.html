<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organise PDF Pages | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Organise PDF Pages</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">PDF & Documents — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">PDF</span><span class="ws-chip">ROTATE</span><span class="ws-chip">REORDER</span></div>
        </div>
      
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";</script>
  <section class="ws-panel p-6">
    <div id="drop" class="rounded-xl border-2 border-dashed border-white/10 p-6 text-center cursor-pointer transition-colors hover:border-white/20">
      <div class="text-2xl mb-1 opacity-30">PDF</div>
      <div class="ws-label">Drop a PDF here or click to browse</div>
      <input id="f" type="file" accept="application/pdf" class="hidden">
    </div>
    <div id="info" class="mt-3 text-[11px] font-mono text-white/50"></div>
    <div id="pages" class="mt-4 grid grid-cols-3 gap-3 sm:grid-cols-5 md:grid-cols-8"></div>
    <div class="mt-4 flex flex-wrap gap-2">
      <button id="rotL" class="ws-btn-ghost" disabled>\u21ba Rotate left</button>
      <button id="rotR" class="ws-btn-ghost" disabled>\u21bb Rotate right</button>
      <button id="del" class="ws-btn-ghost" disabled>\u2715 Delete</button>
      <button id="undo" class="ws-btn-ghost" disabled>\u21a9 Undo</button>
      <button id="go" class="ws-btn" disabled>Download organised PDF</button>
    </div>
    <div id="status" class="mt-3 text-[11px] font-mono text-white/50"></div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
let pages=[],sel=new Set(),history=[],buf=null,totalPages=0;
function setupDrop(zone,input,onFiles){
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('!border-accent','!bg-accent/5')});
  zone.addEventListener('dragleave',e=>{zone.classList.remove('!border-accent','!bg-accent/5')});
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('!border-accent','!bg-accent/5');if(e.dataTransfer.files.length)onFiles(e.dataTransfer.files)});
  input.addEventListener('change',()=>{if(input.files.length)onFiles(input.files)});
}
setupDrop($('drop'),$('f'),async allFiles=>{
  const f=allFiles[0];if(!f||f.type!=='application/pdf')return;
  buf=await f.arrayBuffer();
  const {PDFDocument}=window.PDFLib;
  const doc=await PDFDocument.load(buf);
  totalPages=doc.getPageCount();
  pages=Array.from({length:totalPages},(_,i)=>({idx:i,rot:0,deleted:false}));
  history=[];sel.clear();render();
  $('info').textContent='Loaded: '+f.name+' \u00b7 '+totalPages+' pages \u00b7 '+Math.round(f.size/1024)+' KB';
  $('go').disabled=false;
  // render thumbnails via pdf.js
  const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
  for(let i=1;i<=totalPages;i++){
    const page=await pdf.getPage(i);
    const vp=page.getViewport({scale:0.3});
    const canvas=document.createElement('canvas');
    canvas.width=vp.width;canvas.height=vp.height;
    const ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const thumb=canvas.toDataURL('image/jpeg',0.6);
    const el=document.querySelector('[data-p="'+i+'"] img');
    if(el)el.src=thumb;
  }
});
$('drop').onclick=()=>$('f').click();
function render(){
  if(!pages.length){$('pages').innerHTML='';return}
  $('pages').innerHTML=pages.map((p,i)=>{
    let cls='relative rounded-lg border-2 p-2 cursor-pointer transition-all ';
    if(p.deleted)cls+='opacity-20 border-white/5';
    else if(sel.has(i))cls+='border-accent bg-accent/10 scale-[1.02]';
    else cls+='border-white/10 hover:border-white/30';
    let rotStyle='';
    if(p.rot===90)rotStyle='transform:rotate(90deg);';
    else if(p.rot===180)rotStyle='transform:rotate(180deg);';
    else if(p.rot===270)rotStyle='transform:rotate(270deg);';
    return '<div data-p="'+(i+1)+'" data-i="'+i+'" draggable="true" class="'+cls+'">'+
      '<div class="aspect-[3/4] bg-white/5 rounded flex items-center justify-center overflow-hidden">'+
      '<img src="" alt="p'+(i+1)+'" class="w-full h-full object-contain" style="'+rotStyle+'">'+
      '</div>'+
      '<div class="mt-1 flex items-center justify-between">'+
      '<span class="ws-label">'+(i+1)+'</span>'+
      (p.rot?'<span class="text-[8px] text-accent">'+p.rot+'\u00b0</span>':'')+
      (p.deleted?'<span class="text-[8px] text-red-400">cut</span>':'')+
      '</div></div>';
  }).join('');
  $('pages').querySelectorAll('[data-i]').forEach(el=>{
    el.onclick=e=>{const i=+el.dataset.i;if(sel.has(i))sel.delete(i);else sel.add(i);render()};
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.i);e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
    el.addEventListener('drop',e=>{
      e.preventDefault();const from=+e.dataTransfer.getData('text/plain');const to=+el.dataset.i;
      if(from===to||pages[from].deleted)return;
      const item=pages.splice(from,1)[0];pages.splice(to,0,item);sel.clear();render();
    });
  });
  $('rotL').disabled=sel.size===0;$('rotR').disabled=sel.size===0;$('del').disabled=sel.size===0;
  $('undo').disabled=history.length===0;
}
function snapshot(){history.push(JSON.stringify(pages));if(history.length>20)history.shift()}
$('rotL').onclick=()=>{snapshot();sel.forEach(i=>{if(!pages[i].deleted)pages[i].rot=(pages[i].rot+270)%360});render()};
$('rotR').onclick=()=>{snapshot();sel.forEach(i=>{if(!pages[i].deleted)pages[i].rot=(pages[i].rot+90)%360});render()};
$('del').onclick=()=>{snapshot();sel.forEach(i=>{pages[i].deleted=true});sel.clear();render()};
$('undo').onclick=()=>{if(history.length){pages=JSON.parse(history.pop());sel.clear();render()}};
$('go').onclick=async()=>{
  if(!buf)return;
  $('go').disabled=true;$('status').textContent='Building...';
  try{
    const {PDFDocument,degrees}=window.PDFLib;
    const src=await PDFDocument.load(buf);
    const out=await PDFDocument.create();
    for(const p of pages){if(p.deleted)continue;const[pg]=await out.copyPages(src,[p.idx]);if(p.rot)pg.setRotation(degrees(p.rot));out.addPage(pg)}
    const bytes=await out.save();
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='organised.pdf';a.click();
    $('status').textContent='Done: '+out.getPageCount()+' pages';
  }catch(e){$('status').textContent='\u2717 '+e.message}
  finally{$('go').disabled=false}
};
render();
</script>
</body>
</html>
