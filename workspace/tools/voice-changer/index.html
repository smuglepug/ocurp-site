<!DOCTYPE html>

<html lang="en" class="scroll-smooth">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Changer | Owen's Workspace</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script>

tailwind.config = { theme: { extend: {

  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },

  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }

}}};

</script>

<style>

  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }

  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }

  h1,h2,h3 { font-family:'Manrope',sans-serif; }

  .font-mono { font-family:'IBM Plex Sans',monospace; }

  html,body { max-width:100vw; overflow-x:hidden; }

  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;

    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }

  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }

  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }

  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }

  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }

  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }

  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }

  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }

  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }

  .ws-btn:hover { opacity:.9 }

  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }

  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }

  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }

  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }

  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }

  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }

</style>

</head>

<body class="bg-dark text-white selection:bg-secondary selection:text-black">

<div class="noise-overlay"></div>

<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>

<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">

  <div class="mb-8 flex flex-wrap items-center gap-4">

    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools

    </a>

    <div class="min-w-0">

      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Voice Changer</h1>

      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Audio & Speech — Client-side</p>

          </div>

          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">AUDIO</span><span class="ws-chip">MIC</span><span class="ws-chip">RECORD</span><span class="ws-chip">CLIENT-SIDE</span></div>

        </div>

      

  <section class="ws-panel p-6">

    <div class="flex flex-wrap items-end gap-4">

      <button id="rec" class="ws-btn">Record</button>

      <div><label class="ws-label mb-2 block">Or upload audio</label>

        <input id="file" type="file" accept="audio/*" class="ws-input !w-64"></div>

      <div id="t" class="ws-chip">00:00</div>

    </div>

    <div class="mt-3 text-xs text-white/60" id="status">Press Record and allow the microphone.</div>



    <div class="mt-6 grid gap-4 sm:grid-cols-3">

      <div><label class="ws-label mb-2 block">Voice</label>

        <select id="preset" class="ws-input">

          <option value="none" selected>Original</option>

          <option value="chipmunk">Chipmunk</option>

          <option value="deep">Deep voice</option>

          <option value="monster">Monster</option>

          <option value="giant">Giant</option>

          <option value="robot">Robot</option>

          <option value="alien">Alien</option>

          <option value="phone">Telephone</option>

          <option value="radio">Radio</option>

          <option value="echo">Echo</option>

          <option value="cave">Cave</option>

          <option value="whisper">Whisper</option>

        </select></div>

      <div><label class="ws-label mb-2 block">Pitch &amp; speed: <span id="rv">1.00</span>x</label>

        <input id="rate" type="range" min="0.5" max="2" step="0.01" value="1" class="w-full accent-[#FF5F1F]"></div>

      <div><label class="ws-label mb-2 block">Effect strength: <span id="iv">100</span>%</label>

        <input id="amt" type="range" min="0" max="100" step="1" value="100" class="w-full accent-[#FF5F1F]"></div>

    </div>



    <div class="mt-6 flex flex-wrap items-center gap-4">

      <button id="play" class="ws-btn-ghost">Play result</button>

      <button id="dl" class="ws-btn">Download WAV</button>

      <span class="text-xs text-white/50" id="meta"></span>

    </div>

    <audio id="player" controls class="mt-4 w-full"></audio>

  </section>



  <div id="ws-more" class="mt-12"></div>

  <div class="mt-10 border-t border-white/5 pt-6 text-center">

    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>

  </div>

</div>

<script src="/workspace/related.js" defer></script>

<script>

const $=id=>document.getElementById(id);

let ac=null, buf=null, out=null, outUrl=null, rec=null, chunks=[], timer=null, t0=0;

const ctx=()=>ac||(ac=new (window.AudioContext||window.webkitAudioContext)());



const PRESETS={

 none:    {rate:1,    hp:0,   lp:0,    ring:0,   drive:0,    delay:0,    fb:0,    wet:0,   ir:0},

 chipmunk:{rate:1.38, hp:300, lp:0,    ring:0,   drive:0,    delay:0,    fb:0,    wet:0,   ir:0},

 deep:    {rate:0.78, hp:0,   lp:3200, ring:0,   drive:0.15, delay:0,    fb:0,    wet:0,   ir:0},

 monster: {rate:0.62, hp:0,   lp:900,  ring:0,   drive:0.5,  delay:0,    fb:0,    wet:0.15,ir:0.9},

 giant:   {rate:0.55, hp:0,   lp:1500, ring:0,   drive:0.3,  delay:0,    fb:0,    wet:0.2, ir:1.4},

 robot:   {rate:1,    hp:180, lp:5000, ring:55,  drive:0.25, delay:0,    fb:0,    wet:0,   ir:0},

 alien:   {rate:1.12, hp:400, lp:6000, ring:120, drive:0.2,  delay:0.12, fb:0.25, wet:0.35,ir:0},

 phone:   {rate:1,    hp:400, lp:3200, ring:0,   drive:0.35, delay:0,    fb:0,    wet:0,   ir:0},

 radio:   {rate:1,    hp:600, lp:4200, ring:0,   drive:0.6,  delay:0,    fb:0,    wet:0,   ir:0},

 echo:    {rate:1,    hp:0,   lp:0,    ring:0,   drive:0,    delay:0.26, fb:0.38, wet:0.5, ir:0},

 cave:    {rate:1,    hp:0,   lp:0,    ring:0,   drive:0,    delay:0,    fb:0,    wet:0.35,ir:1.8},

 whisper: {rate:1.04, hp:1500,lp:8000, ring:0,   drive:0,    delay:0,    fb:0,    wet:0,   ir:0}

};



function status(t){$('status').textContent=t}

function irBuffer(c,sec){

  const len=Math.max(1,Math.floor(c.sampleRate*sec));

  const b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);

  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);

  return b;

}

function curve(drive){

  const n=1024, a=new Float32Array(n);

  for(let i=0;i<n;i++){const x=i*2/n-1; a[i]=Math.tanh(x*(1+drive*8))}

  return a;

}

function toWav(b){

  const n=b.length, ch=b.numberOfChannels, sr=b.sampleRate, bytes=n*ch*2;

  const ab=new ArrayBuffer(44+bytes), v=new DataView(ab);

  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};

  ws(0,'RIFF');v.setUint32(4,36+bytes,true);ws(8,'WAVE');ws(12,'fmt ');

  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);

  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);

  ws(36,'data');v.setUint32(40,bytes,true);

  const data=[];for(let c=0;c<ch;c++)data.push(b.getChannelData(c));

  let o=44;

  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){

    let s=Math.max(-1,Math.min(1,data[c][i]));

    v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2;

  }

  return new Blob([ab],{type:'audio/wav'});

}



async function apply(){

  if(!buf){return}

  const amt=parseFloat($('amt').value)/100;

  const p=Object.assign({},PRESETS[$('preset').value]||PRESETS.none);

  const total=Math.max(0.25,Math.min(3,(parseFloat($('rate').value)||1)*p.rate));

  status('Processing...');

  try{

    const outLen=Math.max(1,Math.ceil(buf.length/total));

    const oc=new OfflineAudioContext(1,outLen,buf.sampleRate);

    const s=oc.createBufferSource(); s.buffer=buf; s.playbackRate.value=total;

    let node=s;

    if(p.hp){const f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=p.hp;node.connect(f);node=f}

    if(p.lp){const f=oc.createBiquadFilter();f.type='lowpass';f.frequency.value=p.lp;node.connect(f);node=f}

    if(p.ring){

      const g=oc.createGain(); g.gain.value=0;

      const osc=oc.createOscillator(); osc.frequency.value=p.ring;

      const dep=oc.createGain(); dep.gain.value=1;

      osc.connect(dep); dep.connect(g.gain); node.connect(g); node=g; osc.start(0);

    }

    if(p.drive){const w=oc.createWaveShaper(); w.curve=curve(p.drive*amt); node.connect(w); node=w}

    const dest=oc.createGain();

    const dry=oc.createGain(); dry.gain.value=1-Math.min(.6,p.wet*amt*.5);

    node.connect(dry); dry.connect(dest);

    if(p.delay){

      const d=oc.createDelay(1.5); d.delayTime.value=p.delay;

      const fb=oc.createGain(); fb.gain.value=p.fb;

      const wet=oc.createGain(); wet.gain.value=p.wet*amt;

      node.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(dest);

    }

    if(p.ir){

      const cv=oc.createConvolver(); cv.buffer=irBuffer(oc,p.ir);

      const wg=oc.createGain(); wg.gain.value=p.wet*amt;

      node.connect(cv); cv.connect(wg); wg.connect(dest);

    }

    dest.connect(oc.destination);

    s.start(0);

    out=await oc.startRendering();

    const blob=toWav(out);

    if(outUrl)URL.revokeObjectURL(outUrl);

    outUrl=URL.createObjectURL(blob);

    $('player').src=outUrl;

    $('dl').dataset.ready='1';

    $('meta').textContent=(out.duration).toFixed(1)+'s - '+Math.round(blob.size/1024)+' KB';

    status('Done. '+$('preset').options[$('preset').selectedIndex].text+(total!==1?' at '+total.toFixed(2)+'x':''));

  }catch(e){status('Could not process: '+(e&&e.message?e.message:e))}

}



$('rec').onclick=async()=>{

  if(rec&&rec.state==='recording'){rec.stop();return}

  try{

    const st=await navigator.mediaDevices.getUserMedia({audio:true});

    rec=new MediaRecorder(st); chunks=[];

    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};

    rec.onstop=async()=>{

      clearInterval(timer); st.getTracks().forEach(t=>t.stop());

      $('rec').textContent='Record'; $('rec').classList.remove('rec-on');

      const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});

      try{

        buf=await ctx().decodeAudioData(await blob.arrayBuffer());

        $('t').textContent=buf.duration.toFixed(1)+'s recorded';

        await apply();

      }catch(e){status('Could not decode the recording: '+(e&&e.message?e.message:e))}

    };

    rec.start(); $('rec').textContent='Stop'; $('rec').classList.add('rec-on');

    t0=Date.now();

    timer=setInterval(()=>{$('t').textContent=((Date.now()-t0)/1000).toFixed(1)+'s'},200);

    status('Recording... press Stop when done.');

  }catch(e){status('Microphone blocked or unavailable: '+(e&&e.message?e.message:e))}

};



$('file').onchange=async e=>{

  const f=e.target.files[0]; if(!f)return;

  try{

    buf=await ctx().decodeAudioData(await f.arrayBuffer());

    $('t').textContent=buf.duration.toFixed(1)+'s loaded';

    await apply();

  }catch(e){status('Could not read that file: '+(e&&e.message?e.message:e))}

};



$('dl').onclick=()=>{

  if(!outUrl){status('Record or upload audio first.');return}

  const a=document.createElement('a');

  a.href=outUrl; a.download='changed-voice.wav';

  document.body.appendChild(a); a.click(); a.remove();

  status('Saved changed-voice.wav');

};

$('play').onclick=()=>{if(outUrl){$('player').play()}else{status('Record or upload audio first.')}};

['preset','rate','amt'].forEach(id=>$(id).addEventListener('input',()=>{

  if(id==='rate')$('rv').textContent=parseFloat($('rate').value).toFixed(2);

  if(id==='amt')$('iv').textContent=$('amt').value;

  apply();

}));

$('rv').textContent=parseFloat($('rate').value).toFixed(2);

$('iv').textContent=$('amt').value;

$('rec').classList.add('ws-btn');

</script>

</body>

</html>
