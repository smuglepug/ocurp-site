<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIME Types | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
  .ws-btn.ok::after { content:' \2713'; color:#4ade80 }
  .ws-btn-ghost.ok::after { content:' \2713'; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">MIME Types</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data &amp; Code — Client-side</p>
    </div>
    <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">MIME</span><span class="ws-chip">FILE</span><span class="ws-chip">CLIENT-SIDE</span></div>
  </div>
  <section class="ws-panel p-6">
    <div class="mb-4">
      <label class="ws-label mb-2 block">Search extension or MIME type</label>
      <input id="src" class="ws-input" placeholder=".json / application/pdf / json" value=".json">
    </div>
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <div class="ws-panel ws-copy p-4">
        <div class="mb-2 flex items-center justify-between"><span class="ws-label">Extension &rarr; MIME</span><button id="copyExt" class="ws-btn-ghost !px-3 !py-1.5">Copy</button></div>
        <div id="extResult" class="ws-out break-all"></div>
      </div>
      <div class="ws-panel ws-copy p-4">
        <div class="mb-2 flex items-center justify-between"><span class="ws-label">MIME &rarr; Extensions</span><button id="copyMime" class="ws-btn-ghost !px-3 !py-1.5">Copy</button></div>
        <div id="mimeResult" class="ws-out break-all"></div>
      </div>
    </div>
    <div class="mt-4">
      <div class="ws-label mb-2">Common types — click to look up</div>
      <div id="grid" class="grid gap-2 sm:grid-cols-2 md:grid-cols-3"></div>
    </div>
  </section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const DB={
".html":"text/html",".htm":"text/html",".css":"text/css",".js":"text/javascript",".mjs":"text/javascript",".json":"application/json",".xml":"application/xml",".txt":"text/plain",".csv":"text/csv",".md":"text/markdown",".yaml":"text/yaml",".yml":"text/yaml",".toml":"text/x-toml",
".pdf":"application/pdf",".zip":"application/zip",".gz":"application/gzip",".tar":"application/x-tar",".7z":"application/x-7z-compressed",".rar":"application/vnd.rar",".bz2":"application/x-bzip2",
".png":"image/png",".jpg":"image/jpeg",".jpeg":"image/jpeg",".gif":"image/gif",".svg":"image/svg+xml",".webp":"image/webp",".avif":"image/avif",".bmp":"image/bmp",".ico":"image/x-icon",".tiff":"image/tiff",".heic":"image/heic",".heif":"image/heif",
".mp3":"audio/mpeg",".wav":"audio/wav",".ogg":"audio/ogg",".flac":"audio/flac",".m4a":"audio/mp4",".aac":"audio/aac",".opus":"audio/opus",".aiff":"audio/x-aiff",".mid":"audio/midi",".midi":"audio/midi",
".mp4":"video/mp4",".webm":"video/webm",".avi":"video/x-msvideo",".mov":"video/quicktime",".mkv":"video/x-matroska",".3gp":"video/3gpp",".ogv":"video/ogg",".m3u8":"application/vnd.apple.mpegurl",
".doc":"application/msword",".docx":"application/vnd.openxmlformats-officedocument.wordprocessingml.document",".xls":"application/vnd.ms-excel",".xlsx":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",".ppt":"application/vnd.ms-powerpoint",".pptx":"application/vnd.openxmlformats-officedocument.presentationml.presentation",
".woff":"font/woff",".woff2":"font/woff2",".ttf":"font/ttf",".otf":"font/otf",
".wasm":"application/wasm",".epub":"application/epub+zip",".mobi":"application/x-mobipocket-ebook",".swf":"application/x-shockwave-flash",".torrent":"application/x-bittorrent",
".sqlite3":"application/vnd.sqlite3",".db":"application/vnd.sqlite3",".jar":"application/java-archive",".class":"application/java-vm",".dex":"application/vnd.android.dex",".apk":"application/vnd.android.package-archive",
".rtf":"application/rtf",".exe":"application/x-msdownload",".dll":"application/x-msdownload",".so":"application/octet-stream",".dylib":"application/octet-stream",".bin":"application/octet-stream",
".ps1":"text/plain",".sh":"text/x-shellscript",".bash":"text/x-shellscript",".zsh":"text/x-shellscript",
".py":"text/x-python",".rb":"text/x-ruby",".php":"text/x-php",".java":"text/x-java",".c":"text/x-c",".cpp":"text/x-c++",".cs":"text/x-csharp",".go":"text/x-go",".rs":"text/rust",".ts":"text/typescript",".tsx":"text/jsx",".jsx":"text/jsx",".vue":"text/x-vue",".svelte":"text/x-svelte",".kt":"text/x-kotlin",".swift":"text/x-swift",".scala":"text/x-scala",".pl":"text/x-perl",".lua":"text/x-lua",".r":"text/x-r",".jl":"text/x-julia",".dart":"text/x-dart",".clj":"text/x-clojure",".ex":"text/x-elixir",".fs":"text/x-fsharp",".ml":"text/x-ocaml",".nim":"text/x-nim",".v":"text/x-verilog",
".sql":"application/sql",".graphql":"application/graphql",".gql":"application/graphql",".proto":"text/x-protobuf",
".ini":"text/plain",".conf":"text/plain",".env":"text/plain",".lock":"text/plain",".log":"text/plain",".properties":"text/plain",".cfg":"text/plain",
".glb":"model/gltf-binary",".gltf":"model/gltf+json",".fbx":"model/fbx",".stl":"model/stl",".dae":"model/vnd.collada+xml",".usdz":"model/usd"
};
var REV={};
for(var ext in DB){var m=DB[ext];if(!REV[m])REV[m]=[];REV[m].push(ext)}

function run(){
  var v=$('src').value.trim().toLowerCase();
  if(!v){$('extResult').textContent='';$('mimeResult').textContent='';return}
  var extV,mimeV;
  if(v.startsWith('.')){
    var m=DB[v];extV=m||'(unknown)';mimeV=m?REV[m].join(', '):'(no match)';
  }else if(v.includes('/')){
    var exts=REV[v];extV=exts?exts.join(', '):'(unknown)';mimeV=(v in REV)?v:'(not found)';
  }else{
    var dot='.'+v;var m2=DB[dot];
    if(m2){extV=m2;mimeV=REV[m2].join(', ');}
    else{
      var fuzzy=Object.keys(DB).filter(function(e){return e.slice(1).includes(v)});
      if(fuzzy.length){extV=fuzzy.slice(0,5).map(function(f){return f+' '+DB[f]}).join('\n');mimeV=fuzzy.slice(0,5).map(function(f){return DB[f]}).join(', ');}
      else{extV='(no match)';mimeV='Type .'+v+' or type/subtype';}
    }
  }
  $('extResult').textContent=extV;
  $('mimeResult').textContent=mimeV;
}
$('src').addEventListener('input',run);
$('copyExt').onclick=function(){navigator.clipboard.writeText($('extResult').textContent);$('copyExt').classList.add('ok');setTimeout(function(){$('copyExt').classList.remove('ok')},1200)};
$('copyMime').onclick=function(){navigator.clipboard.writeText($('mimeResult').textContent);$('copyMime').classList.add('ok');setTimeout(function(){$('copyMime').classList.remove('ok')},1200)};
var common=[['.html','text/html'],['.css','text/css'],['.js','text/javascript'],['.json','application/json'],['.xml','application/xml'],['.txt','text/plain'],['.csv','text/csv'],['.md','text/markdown'],['.png','image/png'],['.jpg','image/jpeg'],['.gif','image/gif'],['.svg','image/svg+xml'],['.webp','image/webp'],['.mp3','audio/mpeg'],['.wav','audio/wav'],['.mp4','video/mp4'],['.webm','video/webm'],['.pdf','application/pdf'],['.zip','application/zip'],['.doc','application/msword'],['.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document'],['.xls','application/vnd.ms-excel'],['.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'],['.py','text/x-python'],['.ts','text/typescript'],['.sh','text/x-shellscript'],['.woff2','font/woff2'],['.ttf','font/ttf']];
$('grid').innerHTML=common.map(function(e){var ext=e[0],mime=e[1];return '<button class="ws-btn-ghost !text-left !justify-start !normal-case !tracking-normal !text-[11px] !px-3" data-ext="'+ext+'">'+ext+'<span class="ml-2 text-white/30">'+mime+'</span></button>'}).join('');
$('grid').querySelectorAll('button').forEach(function(b){b.onclick=function(){$('src').value=b.dataset.ext;run()}});
run();
</script>
</body>
</html>
