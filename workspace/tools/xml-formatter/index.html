<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }

<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">XML Formatter</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data & Code — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">XML</span><span class="ws-chip">FORMAT</span><span class="ws-chip">PRETTIFY</span><span class="ws-chip">CLIENT-SIDE</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <label class="ws-label mb-2 block">XML input</label>
    <textarea id="src" class="ws-input min-h-[180px] font-mono" placeholder="<root>...</root>">&lt;?xml version="1.0" encoding="UTF-8"?&gt;&lt;root&gt;&lt;user id="1"&gt;&lt;name&gt;Owen Osayi&lt;/name&gt;&lt;role&gt;founder&lt;/role&gt;&lt;/user&gt;&lt;user id="2"&gt;&lt;name&gt;Ada&lt;/name&gt;&lt;role&gt;engineer&lt;/role&gt;&lt;/user&gt;&lt;/root&gt;</textarea>
    <div class="mt-3 flex flex-wrap items-end gap-3">
      <div><label class="ws-label mb-1 block">Mode</label><select id="mode" class="ws-input !w-36"><option value="pretty">Prettify</option><option value="min">Minify</option></select></div>
      <div><label class="ws-label mb-1 block">Indent</label><select id="ind" class="ws-input !w-36"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tabs</option></select></div>
      <button id="go" class="ws-btn">Format</button>
      <button id="dl" class="ws-btn-ghost">Download .xml</button>
    </div>
    <div class="mt-3 text-[11px] font-mono text-white/40" id="err"></div>
    <div class="ws-panel ws-copy mt-4 p-4"><div class="mb-2 flex items-center justify-between"><span class="ws-label">Formatted XML</span><button class="ws-btn-ghost !px-3 !py-1.5" onclick="cp(this)">Copy</button></div><pre id="out" class="ws-out min-h-[80px]"></pre></div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>function cp(b){const t=document.getElementById('out').textContent;navigator.clipboard.writeText(t);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1200)}
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function formatXml(xml,ind,mode){
  if(mode==='min'){
    return xml.replace(/>\s+</g,'><').replace(/^\s+/,'').replace(/\s+$/,'');
  }
  const pad=ind==='\t'?'\t':' '.repeat(parseInt(ind));
  let level=0;
  let out='';
  // parse into tokens
  let i=0;
  const tokens=[];
  while(i<xml.length){
    if(xml[i]==='<'){
      const end=xml.indexOf('>',i);
      if(end<0){tokens.push({type:'text',val:xml.slice(i)});break}
      const tag=xml.slice(i,end+1);
      if(tag.startsWith('<?'))tokens.push({type:'pi',val:tag});
      else if(tag.startsWith('<!--')){
        const ce=xml.indexOf('-->',i);
        if(ce>=0)tokens.push({type:'comment',val:xml.slice(i,ce+3)});
        i=ce+3;continue;
      } else if(tag.startsWith('<![CDATA[')){
        const ce=xml.indexOf(']]>',i);
        if(ce>=0)tokens.push({type:'cdata',val:xml.slice(i,ce+3)});
        i=ce+3;continue;
      } else if(tag.startsWith('</')){
        tokens.push({type:'end',val:tag});
      } else {
        const isSelf=tag.endsWith('/>');
        // extract tag name
        const m=tag.match(/^<([!\w:.-]+)/);
        tokens.push({type:'start',val:tag,name:m?m[1]:'',self:isSelf});
        if(isSelf)tokens.push({type:'selfclose',val:''});
      }
      i=end+1;
    } else {
      const end=xml.indexOf('<',i);
      if(end<0){tokens.push({type:'text',val:xml.slice(i)});break}
      tokens.push({type:'text',val:xml.slice(i,end)});
      i=end;
    }
  }
  // build output with indentation
  for(let j=0;j<tokens.length;j++){
    const tok=tokens[j];
    if(tok.type==='end'){
      level=Math.max(0,level-1);
      out+=pad.repeat(level)+tok.val+'\n';
    } else if(tok.type==='selfclose'){
      // already handled
    } else if(tok.type==='start'&&tok.self){
      out+=pad.repeat(level)+tok.val+'\n';
    } else if(tok.type==='start'){
      // check if next non-text is end tag (inline element)
      let nextNonText=null;
      for(let k=j+1;k<tokens.length;k++){
        if(tokens[k].type!=='text'||tokens[k].val.trim()){
          nextNonText=tokens[k];break;
        }
      }
      if(nextNonText&&nextNonText.type==='end'){
        // inline element
        const textTok=tokens[j+1]&&tokens[j+1].type==='text'?tokens[j+1].val.trim():'';
        out+=pad.repeat(level)+tok.val+textTok+nextNonText.val+'\n';
        j+=2; // skip text and end
        continue;
      }
      out+=pad.repeat(level)+tok.val+'\n';
      level++;
    } else if(tok.type==='text'){
      const v=tok.val.trim();
      if(v)out+=pad.repeat(level)+v+'\n';
    } else if(tok.type==='comment'||tok.type==='pi'||tok.type==='cdata'){
      out+=pad.repeat(level)+tok.val+'\n';
    }
  }
  return out.trim();
}
function run(){
  $('err').textContent='';
  const t=$('src').value.trim();
  if(!t){$('out').textContent='';return}
  try{
    const parser=new DOMParser();
    const doc=parser.parseFromString(t,'text/xml');
    if(doc.getElementsByTagName('parsererror').length>0){
      const errText=doc.getElementsByTagName('parsererror')[0]?.textContent||'Invalid XML';
      const m=errText.match(/line\s*(\d+)/i);
      $('err').textContent='\u2717 '+(m?'Parse error at line '+m[1]:'Invalid XML');
      $('out').textContent='';
      return;
    }
    const ind=$('ind').value;
    const mode=$('mode').value;
    const result=formatXml(t,ind,mode);
    // syntax highlight
    const highlighted=result
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/(&lt;\?[^&]*\?&gt;)/g,'<span style="color:#6b7280">$1</span>')
      .replace(/(&lt;!--[^&]*--&gt;)/g,'<span style="color:#6b7280">$1</span>')
      .replace(/(&lt;\/?[\w:.-]+)/g,'<span style="color:#FF5F1F">$1</span>')
      .replace(/([\w:.-]+=)("[^"]*")/g,'<span style="color:#4ade80">$1</span><span style="color:#fbbf24">$2</span>')
      .replace(/(&gt;)/g,'<span style="color:#FF5F1F">$1</span>');
    $('out').innerHTML=highlighted;
  }catch(e){
    $('err').textContent='\u2717 '+e.message;
    $('out').textContent='';
  }
}
$('go').onclick=run;
$('src').addEventListener('input',run);
run();
$('dl').onclick=()=>{
  const text=$('out').textContent;
  if(!text)return;
  const b=new Blob([text],{type:'application/xml'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='formatted.xml';a.click();
  URL.revokeObjectURL(u);
};
</script>
</body>
</html>
