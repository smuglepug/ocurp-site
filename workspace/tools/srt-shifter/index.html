<body class="bg-dark text-white selection:bg-secondary selection:text-black">

<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">SRT Shifter</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data & Code — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">SUBTITLES</span><span class="ws-chip">SRT</span><span class="ws-chip">TIMING</span></div>
        </div>
      <section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">SRT Shifter</span></div><div class="grid gap-4 md:grid-cols-3"><div><label class="ws-label mb-2 block" for="off">Shift by (seconds, may be negative)</label><input id="off" type="number" class="ws-input" placeholder="1.5" value="1.5"></div><div><label class="ws-label mb-2 block" for="cps">Max speed (chars per second)</label><input id="cps" type="number" class="ws-input" placeholder="20" value="20"></div><div><label class="ws-label mb-2 block" for="gap">Line gap (extra ms between cues)</label><input id="gap" type="number" class="ws-input" placeholder="0" value="0"></div></div><div class="mt-5 flex flex-wrap items-center gap-3"><button id="go" class="ws-btn">Shift and re-time</button><button id="norm" class="ws-btn-ghost">Renumber from 1</button><a id="dl" class="ws-btn-ghost pointer-events-none opacity-40">Download .srt</a><span class="text-xs text-white/50" id="status"></span></div><div class="mt-5"><div class="ws-label mb-2">Output</div><div id="out" class="ws-out"></div></div><p class="mt-3 text-xs text-white/60">Cues longer than their text can be read at the given speed are shortened so subtitles never overlap. Nothing is shifted past 00:00:00,000.</p></section><div><label class="ws-label mb-2 block" for="src">Subtitle text (.srt)</label><textarea id="src" rows="8" class="ws-input font-mono text-xs" placeholder="1
00:00:01,000 --> 00:00:04,000
The quick brown fox jumps.

2
00:00:05,500 --> 00:00:07,000
Second line here.
">1
00:00:01,000 --> 00:00:04,000
The quick brown fox jumps.

2
00:00:05,500 --> 00:00:07,000
Second line here.
</textarea></div>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">

<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const TC=/(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3})([^\n]*)/g;
const parse=ts=>{ // "01:02:03,456" -> ms
  // Split on colons, then split the SECONDS field on its , or . separator.
  // The separator has to be a delimiter, not something to strip: removing the
  // comma from '01,000' leaves '01000', i.e. 1000 seconds, and replacing it
  // with a dot glues the fraction onto the field so Number() gives NaN.
  const p=ts.trim().split(':');
  const sec=String(p[2]||0).split(/[,.]/);
  const whole=Number(sec[0]||0);
  const frac=Number(String(sec[1]===undefined?'0':sec[1]).slice(0,3).padEnd(3,'0'));
  return Math.round(((Number(p[0]||0)*60+Number(p[1]||0))*60+whole)*1000+frac);
};
const fmt=ms=>{
  if(ms<0) ms=0;
  const h=Math.floor(ms/3600000); ms-=h*3600000;
  const m=Math.floor(ms/60000); ms-=m*60000;
  const sec=Math.floor(ms/1000); ms-=sec*1000;
  const p=(n,w)=>String(n).padStart(w,'0');
  return p(h,2)+':'+p(m,2)+':'+p(sec,2)+','+p(ms,3);
};
// cue text = every non-empty line between a timing line and the next blank line
function parseCues(src){
  const text=src.replace(/\r/g,'');
  const lines=text.split('\n');
  const cues=[]; let i=0;
  while(i<lines.length){
    // TC is a /g regex, so exec() would carry lastIndex between cues and
    // silently skip every other timestamp. Reset it before every test.
    TC.lastIndex=0;
    const t=TC.exec(lines[i]);
    if(t){
      const start=parse(t[1]), end=parse(t[2]);
      const settings=t[3].trim();
      const body=[];
      i++;
      while(i<lines.length && lines[i].trim()!==''){
        if(!/^\d+$/.test(lines[i].trim())) body.push(lines[i]);
        i++;
      }
      if(end>start) cues.push({start:start,end:end,settings:settings,text:body});
    } else i++;
  }
  return cues;
}
function render(cues){
  return cues.map((c,i)=>(i+1)+'\n'+fmt(c.start)+' --> '+fmt(c.end)
    +(c.settings?' '+c.settings:'')+'\n'+c.text.join('\n')).join('\n\n')+'\n';
}
function run(){
  const off=Math.round(parseFloat($('off').value||'0')*1000);
  const cps=Math.max(1,parseInt($('cps').value||'20',10));
  const gap=Math.round(parseInt($('gap').value||'0',10));
  const cues=parseCues($('src').value);
  if(!cues.length){ $('status').textContent='No cues found - check the timestamps.'; $('out').textContent=''; return; }
  const before=cues[0].start, last=cues[cues.length-1].end;
  let prevEnd=null, shortened=0, clipped=0;
  for(const c of cues){
    c.start=Math.max(0,c.start+off);
    c.end=Math.max(0,c.end+off);
    if(prevEnd!==null && c.start<prevEnd+gap){ c.start=prevEnd+gap; shortened++; }
    if(c.start===0 && c.end===0) { c.end=0; }
    if(c.end<=c.start) c.end=c.start+1;
    // reading speed: at least chars/cps seconds on screen
    const chars=c.text.join(' ').replace(/<[^>]*>/g,'').length;
    const need=Math.ceil(chars/cps*1000);
    if(c.end-c.start<need){ c.end=c.start+need; shortened++; }
    if(prevEnd!==null && c.start<prevEnd){ clipped++; }
    prevEnd=c.end;
  }
  // renumber so the indexes are sequential again
  const out=render(cues);
  $('out').textContent=out;
  $('dl').href='data:text/plain;charset=utf-8,'+encodeURIComponent(out);
  $('dl').download='shifted.srt';
  $('dl').classList.remove('pointer-events-none','opacity-40');
  const net=off>=0?('+'+off+'ms'):(off+'ms');
  $('status').textContent=cues.length+' cues, shift '+net+', '
    +shortened+' adjusted, start was '+fmt(before)+', end now '+fmt(last+off)+'.';
}
$('go').addEventListener('click',run);
$('norm').addEventListener('click',()=>{
  $('off').value='0'; $('cps').value='0'; $('gap').value='0';
  const cues=parseCues($('src').value);
  $('out').textContent=render(cues);
  $('dl').href='data:text/plain;charset=utf-8,'+encodeURIComponent($('out').textContent);
  $('dl').classList.remove('pointer-events-none','opacity-40');
  $('status').textContent='Renumbered only - timings untouched.';
});
run();
</script>
</body>
