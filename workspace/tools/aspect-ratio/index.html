<script>const $=id=>document.getElementById(id);































const gcd=(a,b)=>b?gcd(b,a%b):a;































const PRE=[[16,9],[4,3],[1,1],[21,9],[9,16],[3,2],[2,3]];































$('presets').innerHTML=PRE.map(([a,b])=>'<button data-w="'+a+'" data-h="'+b+'" class="ws-chip hover:!text-white">'+a+':'+b+'</button>').join('');































$('presets').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('w').value=b.dataset.w;$('h').value=b.dataset.h;run(true)});































function run(fromWH){const w=+$('w').value||1,h=+$('h').value||1,g=gcd(w,h);































  $('simp').textContent=(w/g)+':'+(h/g);































  if(fromWH){$('nw').value='';$('nh').value=''}































  else{if($('nw').value)$('nh').value=Math.round(+$('nw').value*h/w);if($('nh').value)$('nw').value=Math.round(+$('nh').value*w/h)}































  const W=+$('nw').value||w,H=+$('nh').value||h,sc=Math.min(260/W,260/H);































  $('prev').style.width=(W*sc)+'px';$('prev').style.height=(H*sc)+'px';































  $('prev').style.aspectRatio=W+' / '+H;}































['w','h'].forEach(id=>$(id).addEventListener('input',()=>run(true)));































['nw','nh'].forEach(id=>$(id).addEventListener('input',()=>run(false)));run(true);</script>
