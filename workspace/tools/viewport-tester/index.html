<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewport Tester | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Viewport Tester</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Network & Web — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">RESPONSIVE</span><span class="ws-chip">DEVICES</span><span class="ws-chip">WEB</span></div>
        </div>
      <section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Viewport</span></div><div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div><label class="ws-label mb-2 block" for="w">Width (px)</label><input id="w" type="text" class="ws-input" placeholder="390" value="390"></div><div><label class="ws-label mb-2 block" for="h">Height (px)</label><input id="h" type="text" class="ws-input" placeholder="844" value="844"></div><div><label class="ws-label mb-2 block" for="dpr">Device pixel ratio</label><input id="dpr" type="text" class="ws-input" placeholder="3" value="3"></div><div><label class="ws-label mb-2 block">Preset</label><select id="preset" class="ws-input"><option value="custom">Custom</option><option value="iphone-se">iPhone SE - 375x667 @2</option><option value="iphone-14">iPhone 14 - 390x844 @3</option><option value="iphone-15-pro-max">iPhone 15 Pro Max - 430x932 @3</option><option value="pixel-7">Pixel 7 - 412x915 @2.625</option><option value="galaxy-s23">Galaxy S23 - 360x780 @3</option><option value="ipad">iPad - 820x1180 @2</option><option value="ipad-land">iPad landscape - 1180x820 @2</option><option value="laptop">Laptop - 1440x900 @2</option><option value="desktop">Desktop - 1920x1080 @1</option></select></div></div><div class="mt-5 flex flex-wrap items-center gap-3"><label class="flex items-center gap-2 text-xs text-white/70"><input id="url" class="ws-input" style="width:22rem" value="https://ocurp.space"></label><button id="go" class="ws-btn">Open in frame</button><button id="measure" class="ws-btn-ghost">Measure this page</button><span class="text-xs text-white/50" id="cnt"></span></div></section><div class="ws-panel mt-4 p-5"><div class="ws-label mb-3">Frame</div><div class="flex flex-wrap items-start gap-6"><div><div id="frameWrap" class="border border-white/15 bg-black"><iframe id="frame" class="block bg-white" width="390" height="844" title="viewport preview"></iframe></div><div class="mt-2 text-xs text-white/50" id="dims"></div></div><div class="min-w-[16rem] flex-1"><div class="ws-label mb-2">Device pixels vs CSS pixels</div><div id="scaleInfo" class="font-mono text-xs leading-relaxed text-white/70"></div><div class="ws-label mt-4 mb-2">Breakpoint reference</div><div id="bps" class="font-mono text-xs leading-relaxed text-white/70"></div></div></div></div><div class="mt-5"><div class="ws-label mb-2">Live measurements of this page</div><div id="out" class="ws-out"></div></div>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/tools/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const PRESETS={
 'iphone-se':[375,667,2],'iphone-14':[390,844,3],'iphone-15-pro-max':[430,932,3],
 'pixel-7':[412,915,2.625],'galaxy-s23':[360,780,3],'ipad':[820,1180,2],
 'ipad-land':[1180,820,2],'laptop':[1440,900,2],'desktop':[1920,1080,1]
};
const BP=[['xs','< 640px','phones portrait, stacked nav'],
          ['sm','>= 640px','two columns starts'],
          ['md','>= 768px','tablet, three columns'],
          ['lg','>= 1024px','laptop, sidebar appears'],
          ['xl','>= 1280px','wide desktop'],
          ['2xl','>= 1536px','max-width containers']];
function sync(){
  const w=parseInt($('w').value||'0',10), h=parseInt($('h').value||'0',10), d=parseFloat($('dpr').value||'1');
  const f=$('frame');
  f.width=w; f.height=h;
  f.style.transformOrigin='top left';
  f.style.transform='scale('+Math.min(1, 520/w)+')';
  $('dims').textContent=w+' x '+h+' CSS px  |  '+Math.round(w*d)+' x '+Math.round(h*d)+' device px';
  $('scaleInfo').innerHTML=
    'CSS viewport: <strong>'+w+' x '+h+'</strong><br>'
   +'Physical pixels: <strong>'+Math.round(w*d)+' x '+Math.round(h*d)+'</strong><br>'
   +'Ratio: <strong>'+d+'x</strong><br>'
   +'Diagonal: <strong>'+(Math.sqrt(w*w+h*h)/d/160).toFixed(2)+' in</strong> (CSS px / dpr, approximated)<br>'
   +'In Tailwind terms: <strong>'+(['xs','sm','md','lg','xl','2xl'].filter(b=>
        b==='xs' ? w<640 : w>={'sm':640,'md':768,'lg':1024,'xl':1280,'2xl':1536}[b])[0]||'xs')+'</strong> and up';
  $('bps').innerHTML=BP.map(([n,q,d2])=>{
    const min=n==='xs'?0:{'sm':640,'md':768,'lg':1024,'xl':1280,'2xl':1536}[n];
    const on=w>=min;
    return '<span style="color:'+(on?'#FF5F1F':'rgba(255,255,255,.45)')+'">'
      +(on?'● ':'○ ')+n.padEnd(4)+q.padEnd(10)+d2+'</span>';
  }).join('<br>');
  $('cnt').textContent='Previewing '+w+'x'+h+'.';
}
function open(){
  let u=$('url').value.trim();
  if(!u) return;
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  $('frame').src=u;
  sync();
}
$('preset').addEventListener('change',()=>{
  const p=$('preset').value;
  if(p==='custom'){ sync(); return; }
  const [w,h,d]=PRESETS[p];
  $('w').value=w; $('h').value=h; $('dpr').value=d;
  sync();
});
['w','h','dpr'].forEach(k=>$(k).addEventListener('input',()=>{ $('preset').value='custom'; sync(); }));
$('go').addEventListener('click',open);
$('measure').addEventListener('click',()=>{
  $('w').value=window.innerWidth; $('h').value=window.innerHeight;
  $('dpr').value=window.devicePixelRatio;
  $('preset').value='custom';
  sync();
  const vv=window.visualViewport;
  $('out').textContent=
    'This browser: '+window.innerWidth+' x '+window.innerHeight+' CSS px at '+window.devicePixelRatio+'x'
    +'  |  screen '+screen.width+' x '+screen.height
    +(vv ? '  |  visual viewport '+Math.round(vv.width)+' x '+Math.round(vv.height)+', scale '+vv.scale.toFixed(2)
        : '  |  no visualViewport API');
});
sync();
</script>
</body>
</html>
