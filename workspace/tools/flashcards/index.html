<script>const $=id=>document.getElementById(id);































let deck=JSON.parse(localStorage.getItem('ws-fc')||'[]'),i=0,back=false;































const save=()=>localStorage.setItem('ws-fc',JSON.stringify(deck));































function render(){const n=deck.length;if(i>=n)i=0;if(i<0)i=Math.max(0,n-1);































 $('ct').textContent=n+' card'+(n===1?'':'s');































 if(!n){$('cardbox').textContent='Add a card to begin.';$('list').innerHTML='';return}































 const c=deck[i];$('cardbox').textContent=back?c.a:c.q;































 $('cardbox').style.color=back?'#FF5F1F':'#fff';































 $('list').innerHTML=deck.map((c2,k)=>'<div class="flex items-center gap-3 rounded-xl border border-white/10 bg-white/[0.03] p-3 text-sm">'































  +'<span class="ws-chip">'+(k+1)+'</span><span class="min-w-0 flex-1 truncate text-white/80">'+esc(c2.q)+'</span>'































  +'<span class="min-w-0 flex-1 truncate text-white/45">'+esc(c2.a)+'</span>'































  +'<button data-del="'+k+'" class="text-white/30 hover:text-red-400">\u00d7</button></div>').join('');































 $('list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{deck.splice(+b.dataset.del,1);save();render()});}































const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));































function add(){const q=$('qq').value.trim(),a=$('aa').value.trim();if(!q||!a)return;































 deck.push({q,a});$('qq').value='';$('aa').value='';save();i=deck.length-1;back=false;render()}































$('add').onclick=add;































['qq','aa'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')add()}));































$('flip').onclick=()=>{back=!back;render()};































$('cardbox').onclick=()=>{back=!back;render()};































$('next').onclick=()=>{back=false;i++;render()};































$('prev').onclick=()=>{back=false;i--;render()};































$('shuf').onclick=()=>{deck.sort(()=>Math.random()-.5);save();i=0;back=false;render()};































$('clr').onclick=()=>{if(confirm('Clear the whole deck?')){deck=[];save();render()}};































function dl(name,text,type){const a=document.createElement('a');































 a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;a.click()}































$('exp').onclick=()=>dl('flashcards.csv','question,answer\n'+deck.map(c=>'"'+c.q.replace(/"/g,'""')+'","'+c.a.replace(/"/g,'""')+'"').join('\n'),'text/csv');































$('expj').onclick=()=>dl('flashcards.json',JSON.stringify(deck,null,2),'application/json');































$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();































 r.onload=()=>{r.result.split(/\r?\n/).forEach((line,k)=>{if(!line.trim())return;if(k===0&&/^"?question"?/i.test(line))return;































  const p=line.match(/("([^"]|"")*"|[^,]*),("([^"]|"")*"|[^,]*)/);if(!p)return;































  const q=(p[1]||'').replace(/^"|"$/g,'').replace(/""/g,'"').trim();































  const a=(p[3]||'').replace(/^"|"$/g,'').replace(/""/g,'"').trim();































  if(q&&a)deck.push({q,a})});save();render()};r.readAsText(f)};































addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key===' ')  {e.preventDefault();$('flip').click()}});































render();</script>
