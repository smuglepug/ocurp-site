<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Element Mixer | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Element Mixer</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Study & Career — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">CHEMISTRY</span><span class="ws-chip">PERIODIC TABLE</span><span class="ws-chip">COMPOUNDS</span></div>
        </div>
      <section class="ws-panel p-6"><p class="mb-4 text-sm text-white/60">Click any element for its data. Pick two to see the compound they most commonly form. All 118 elements are listed \u2014 nothing here needs a server.</p><div class="flex flex-wrap items-end gap-3"><div><label class="ws-label mb-2 block">Search</label><input id="q" class="ws-input !w-56" placeholder="name, symbol or number"></div><div class="flex gap-2"><button id="clr" class="ws-btn-ghost">Clear picks</button></div></div><div id="table" class="mt-5 grid grid-cols-6 gap-1.5 sm:grid-cols-10 lg:grid-cols-18"></div><div id="card" class="mt-6 grid gap-4 sm:grid-cols-2"></div><div id="mix" class="mt-4 rounded-xl border border-accent/30 bg-accent/5 p-4 text-sm text-white/80">Pick two elements to mix them.</div></section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>const $=id=>document.getElementById(id);
const RAW="H Hydrogen 1 1.008 nonmetal|He Helium 2 4.003 noble|Li Lithium 3 6.94 alkali|Be Beryllium 4 9.012 alkaline|B Boron 5 10.81 metalloid|C Carbon 6 12.011 nonmetal|N Nitrogen 7 14.007 nonmetal|O Oxygen 8 15.999 nonmetal|F Fluorine 9 18.998 halogen|Ne Neon 10 20.180 noble|Na Sodium 11 22.990 alkali|Mg Magnesium 12 24.305 alkaline|Al Aluminium 13 26.982 post|Si Silicon 14 28.085 metalloid|P Phosphorus 15 30.974 nonmetal|S Sulfur 16 32.06 nonmetal|Cl Chlorine 17 35.45 halogen|Ar Argon 18 39.948 noble|K Potassium 19 39.098 alkali|Ca Calcium 20 40.078 alkaline|Sc Scandium 21 44.956 transition|Ti Titanium 22 47.867 transition|V Vanadium 23 50.942 transition|Cr Chromium 24 51.996 transition|Mn Manganese 25 54.938 transition|Fe Iron 26 55.845 transition|Co Cobalt 27 58.933 transition|Ni Nickel 28 58.693 transition|Cu Copper 29 63.546 transition|Zn Zinc 30 65.38 transition|Ga Gallium 31 69.723 post|Ge Germanium 32 72.630 metalloid|As Arsenic 33 74.922 metalloid|Se Selenium 34 78.971 nonmetal|Br Bromine 35 79.904 halogen|Kr Krypton 36 83.798 noble|Rb Rubidium 37 85.468 alkali|Sr Strontium 38 87.62 alkaline|Y Yttrium 39 88.906 transition|Zr Zirconium 40 91.224 transition|Nb Niobium 41 92.906 transition|Mo Molybdenum 42 95.95 transition|Tc Technetium 43 98 transition|Ru Ruthenium 44 101.07 transition|Rh Rhodium 45 102.91 transition|Pd Palladium 46 106.42 transition|Ag Silver 47 107.87 transition|Cd Cadmium 48 112.41 transition|In Indium 49 114.82 post|Sn Tin 50 118.71 post|Sb Antimony 51 121.76 metalloid|Te Tellurium 52 127.60 metalloid|I Iodine 53 126.90 halogen|Xe Xenon 54 131.29 noble|Cs Caesium 55 132.91 alkali|Ba Barium 56 137.33 alkaline|La Lanthanum 57 138.91 lanthanide|Ce Cerium 58 140.12 lanthanide|Pr Praseodymium 59 140.91 lanthanide|Nd Neodymium 60 144.24 lanthanide|Pm Promethium 61 145 lanthanide|Sm Samarium 62 150.36 lanthanide|Eu Europium 63 151.96 lanthanide|Gd Gadolinium 64 157.25 lanthanide|Tb Terbium 65 158.93 lanthanide|Dy Dysprosium 66 162.50 lanthanide|Ho Holmium 67 164.93 lanthanide|Er Erbium 68 167.26 lanthanide|Tm Thulium 69 168.93 lanthanide|Yb Ytterbium 70 173.05 lanthanide|Lu Lutetium 71 174.97 lanthanide|Hf Hafnium 72 178.49 transition|Ta Tantalum 73 180.95 transition|W Tungsten 74 183.84 transition|Re Rhenium 75 186.21 transition|Os Osmium 76 190.23 transition|Ir Iridium 77 192.22 transition|Pt Platinum 78 195.08 transition|Au Gold 79 196.97 transition|Hg Mercury 80 200.59 transition|Tl Thallium 81 204.38 post|Pb Lead 82 207.2 post|Bi Bismuth 83 208.98 post|Po Polonium 84 209 post|At Astatine 85 210 halogen|Rn Radon 86 222 noble|Fr Francium 87 223 alkali|Ra Radium 88 226 alkaline|Ac Actinium 89 227 actinide|Th Thorium 90 232.04 actinide|Pa Protactinium 91 231.04 actinide|U Uranium 92 238.03 actinide|Np Neptunium 93 237 actinide|Pu Plutonium 94 244 actinide|Am Americium 95 243 actinide|Cm Curium 96 247 actinide|Bk Berkelium 97 247 actinide|Cf Californium 98 251 actinide|Es Einsteinium 99 252 actinide|Fm Fermium 100 257 actinide|Md Mendelevium 101 258 actinide|No Nobelium 102 259 actinide|Lr Lawrencium 103 266 actinide|Rf Rutherfordium 104 267 transition|Db Dubnium 105 268 transition|Sg Seaborgium 106 269 transition|Bh Bohrium 107 270 transition|Hs Hassium 108 269 transition|Mt Meitnerium 109 278 transition|Ds Darmstadtium 110 281 transition|Rg Roentgenium 111 282 transition|Cn Copernicium 112 285 transition|Nh Nihonium 113 286 post|Fl Flerovium 114 289 post|Mc Moscovium 115 290 post|Lv Livermorium 116 293 post|Ts Tennessine 117 294 halogen|Og Oganesson 118 294 noble".split('|').map(s=>{const a=s.split(' ');
 return {sym:a[0],name:a[1],num:+a[2],mass:a[3],cat:a[4]}});
const COL={nonmetal:'#22d3ee',noble:'#a855f7',alkali:'#ef4444',alkaline:'#f97316',metalloid:'#84cc16',
 transition:'#64748b',post:'#94a3b8',halogen:'#eab308',lanthanide:'#ec4899',actinide:'#f43f5e'};
const CMP="H,O,Water ~ H2O|H,Cl,Hydrochloric acid ~ HCl|Na,Cl,Table salt ~ NaCl|C,O,Carbon dioxide ~ CO2|Ca,O,Quicklime ~ CaO|H,N,Ammonia ~ NH3|C,H,Methane ~ CH4|K,Cl,Potash ~ KCl|Mg,O,Magnesia ~ MgO|Cu,O,Copper(II) oxide ~ CuO|Zn,S,Zinc sulfide ~ ZnS|Fe,O,Iron(III) oxide ~ Fe2O3|S,O,Sulfur dioxide ~ SO2|N,O,Nitrous oxide ~ N2O|Al,O,Alumina ~ Al2O3|Si,O,Silica ~ SiO2|Ag,Cl,Silver chloride ~ AgCl|Ba,S,Barium sulfide ~ BaS|Li,Cl,Lithium chloride ~ LiCl|Br,H,Hydrobromic acid ~ HBr|I,K,Potassium iodide ~ KI|Ca,C,Calcium carbide ~ CaC2|P,O,Phosphorus pentoxide ~ P4O10|Sn,O,Tin(IV) oxide ~ SnO2|Pb,S,Galena ~ PbS|Hg,S,Cinnabar ~ HgS|N,H,Hydrazine ~ N2H4|C,Cl,Carbon tetrachloride ~ CCl4|Au,Cl,Gold(III) chloride ~ AuCl3|Sr,O,Strontia ~ SrO".split('|').map(s=>{const a=s.split(',');return {a:a[0],b:a[1],label:a[2]}});
let picks=[];
function render(){$('table').innerHTML=RAW.map(e=>{
 const on=picks.includes(e.sym);const c=COL[e.cat]||'#64748b';
 return '<button data-s="'+e.sym+'" title="'+e.name+'" class="flex aspect-square flex-col items-center justify-center rounded-md border text-center transition-all '
  +(on?'border-accent bg-accent/20 ':'border-white/10 bg-white/[0.03] hover:border-white/30 ')+'" style="box-shadow:inset 0 0 0 2px '+c+'22">'
  +'<span class="font-display text-sm font-black text-white">'+e.sym+'</span>'
  +'<span class="text-[7px] text-white/40">'+e.num+'</span></button>'}).join('');
 $('table').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
   const s=b.dataset.s;if(picks.includes(s))picks=picks.filter(x=>x!==s);
   else picks=(picks.length>=2?[picks[1],s]:picks.concat(s));render();info()});}
function info(){const sel=picks.map(s=>RAW.find(e=>e.sym===s)).filter(Boolean);
 $('card').innerHTML=sel.map(e=>'<div class="rounded-xl border border-white/10 bg-white/[0.04] p-4">'
  +'<div class="flex items-baseline gap-2"><span class="font-display text-3xl font-black text-white">'+e.sym+'</span>'
  +'<span class="text-sm text-white/60">'+e.name+'</span><span class="ml-auto ws-chip">'+e.cat+'</span></div>'
  +'<div class="mt-2 font-mono text-xs text-white/55">Z = '+e.num+' \u00b7 atomic mass '+e.mass+'</div></div>').join('');
 if(sel.length===2){const m=CMP.find(x=>(x.a===sel[0].sym&&x.b===sel[1].sym)||(x.a===sel[1].sym&&x.b===sel[0].sym));
  $('mix').innerHTML=m?('<span class="ws-label">Common compound</span><div class="mt-1 font-display text-xl font-black text-accent">'+m.label+'</div>')
   :('<span class="ws-label">No common binary compound on file</span><div class="mt-1 text-white/55">'+sel[0].name+' + '+sel[1].name+' \u2014 try a metal and a non-metal, or an oxide pair.</div>')}
 else $('mix').textContent=picks.length===1?'Pick one more element to mix.':'Pick two elements to mix them.'}
$('clr').onclick=()=>{picks=[];render();info()};
$('q').addEventListener('input',()=>{const v=$('q').value.trim().toLowerCase();
 if(!v){render();return}
 $('table').querySelectorAll('[data-s]').forEach(b=>{const e=RAW.find(x=>x.sym===b.dataset.s);
  const hit=e.name.toLowerCase().includes(v)||e.sym.toLowerCase()===v||String(e.num)===v;
  b.style.opacity=hit?1:.18})});
render();info();</script>
</body>
</html>
