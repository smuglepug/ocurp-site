tailwind.config = { theme: { extend: {

<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">GST / VAT Calculator</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Math & Conversion — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">GST</span><span class="ws-chip">VAT</span><span class="ws-chip">TAX</span><span class="ws-chip">CLIENT-SIDE</span></div>
        </div>
      <section class="ws-panel p-6"><div class="grid items-end gap-4 md:grid-cols-2 lg:grid-cols-4"><div><label class="ws-label mb-2 block" for="rate">Tax rate</label><select id="rate" class="ws-input !w-full"><option value="7.5" selected>Nigeria 7.5%</option><option value="20">United Kingdom 20%</option><option value="19">EU / Germany 19%</option><option value="18">India 18%</option><option value="5">Canada 5%</option><option value="10">Australia 10%</option><option value="0">United States 0% (no federal VAT)</option><option value="custom">Custom rate...</option></select></div><div><label class="ws-label mb-2 block" for="custom">Custom rate (%)</label><input id="custom" type="number" class="ws-input" placeholder="only used when Custom is picked" value="0"></div><div><label class="ws-label mb-2 block" for="mode">Direction</label><select id="mode" class="ws-input !w-full"><option value="add" selected>Add tax to a NET amount</option><option value="remove">Remove tax from a GROSS amount</option></select></div><div><label class="ws-label mb-2 block" for="amt">Amount</label><input id="amt" type="number" class="ws-input" placeholder="0" value="10000"></div></div><div class="mt-4 flex flex-wrap items-center gap-2"><button id="mAdd" class="ws-btn-ghost !px-3 !py-1.5" onclick="setMode('add')">Add tax</button><button id="mRemove" class="ws-btn-ghost !px-3 !py-1.5" onclick="setMode('remove')">Remove tax</button><span id="modeNote" class="text-xs text-white/45"></span></div><div class="mt-3 text-[11px] font-mono text-white/45" id="err"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Result</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="out" onclick="cp(this)">Copy</button></div><div id="stats" class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Price list</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="out" onclick="cp(this)">Copy</button></div><div class="grid items-end gap-4 md:grid-cols-3"><div><label class="ws-label mb-2 block" for="li">Add a line item (net amount)</label><input id="li" class="ws-input" type="number" value="0" placeholder="0"></div><div><button class="ws-btn" onclick="addItem()">Add item</button></div><div class="self-end text-xs text-white/40" id="hint">Items total against the rate above, whatever the single-amount direction is set to.</div></div><div class="overflow-x-auto"><table class="w-full text-left text-sm "><thead class="ws-label"><tr><th class="py-2 pr-4">Item</th><th class="py-2 pr-4">Net</th><th class="py-2 pr-4">Tax</th><th class="py-2 pr-4">Gross</th></tr></thead><tbody id="items"></tbody></table></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">The two-way distinction</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="out" onclick="cp(this)">Copy</button></div><div class="rounded-lg border border-white/10 bg-[#0d0d0d] p-5"><div class="ws-label">Why removing divides</div><div id="note" class="mt-2 text-sm text-white/70">-</div></div></section><section class="ws-panel mt-4 p-5"><div class="ws-label mb-3">Worked numbers</div><pre id="out" class="ws-out"></pre></section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/tools/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<!-- Mobile play mode: touch-action none on the canvas (otherwise a swipe scrolls
     the page instead of steering the game), a Fullscreen control that requests
     real fullscreen + landscape lock, and a persistent top-left Exit. Inert on
     desktop. Regenerate every game page after editing either file. -->
<link rel="stylesheet" href="/workspace/play.css">
<script src="/workspace/play.js" defer></script>
<script>
function cp(btn){
  var el=document.getElementById(btn.getAttribute('data-t')||'out');
  var t=el?el.textContent:'';
  try{navigator.clipboard.writeText(t)}catch(e){}
  btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy'},1200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function card(k,v){return '<div class="rounded-xl border border-white/10 bg-white/[0.04] p-4 text-center">'
 +'<div class="font-display text-xl font-black text-accent">'+esc(v)+'</div>'
 +'<div class="ws-label mt-1">'+esc(k)+'</div></div>';}
function show(list){document.getElementById('stats').innerHTML=list.map(function(p){return card(p[0],p[1])}).join('');}
function seterr(pid,msg){var e=document.getElementById(pid);if(!e)return;
  e.textContent=msg?'\u2717 '+msg:''; e.style.color=msg?'#f87171':'';}
var $=function(id){return document.getElementById(id)};
// Round to n decimals but drop a trailing -0 so 0.30000000000000004 never shows.
function r(n,d){
  if(!isFinite(n)) return String(n);
  var f=Math.pow(10,d===undefined?6:d);
  var v=Math.round(n*f)/f;
  if(Object.is(v,-0)) v=0;
  return v;
}
// Thousands separators for display; grouping is presentation only.
function grp(n,d){
  var v=r(n,d===undefined?2:d);
  var s=String(Math.abs(v));
  var parts=s.split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  // Pad to the requested decimals. Without this grp(20000,2) returned
  // '20,000' and a money column rendered as a bare integer.
  while(parts.length<2) parts.push('');
  if(d>0 && parts[1].length<d) parts[1]=(parts[1]+'0'.repeat(d)).slice(0,d);
  return (v<0?'-':'')+parts.join('.');
}
function bind(ids,fn){ids.forEach(function(id){var el=$(id);if(!el)return;
  el.addEventListener('input',fn); el.addEventListener('change',fn);});}
function wire(fn){fn();}
// Table-row builder. Cells are trusted HTML (values are escaped at the
// point they are produced), matching the Python row() used server-side.
function row(cells){return '<tr class="border-t border-white/5">'+cells.map(function(c){
  return '<td class="py-2 pr-4">'+c+'</td>';}).join('')+'</tr>';}

// ---- pure maths --------------------------------------------------------
function addTax(net, ratePct){ return net*ratePct/100; }
function grossFromNet(net, ratePct){ return net + addTax(net, ratePct); }
function netFromGross(gross, ratePct){ return gross/(1+ratePct/100); }
function taxFromGross(gross, ratePct){ return gross - netFromGross(gross, ratePct); }
function currentRate(){
  var v = $('rate').value;
  return v === 'custom' ? (parseFloat($('custom').value)||0) : parseFloat(v);
}
window.__gst = {addTax:addTax, grossFromNet:grossFromNet,
                netFromGross:netFromGross, taxFromGross:taxFromGross};

// Pre-filled so the price list shows a real total on load rather than an
// empty state the visitor has to fill in before seeing anything work.
var ITEMS = [1200, 450.5, 99.99, 250];
function setMode(m){ $('mode').value = m; paint(); }
function addItem(){
  var v = parseFloat($('li').value);
  if(!isFinite(v) || v === 0){ seterr('err','Type a non-zero net amount to add.'); return; }
  ITEMS.push(v); $('li').value = '0'; paint();
}
function clearItems(){ ITEMS = []; paint(); }

function paint(){
  seterr('err','');
  var rate = currentRate();
  var mode = $('mode').value;
  var amt = parseFloat($('amt').value);
  if(!isFinite(rate) || rate < 0 || rate > 100){
    seterr('err','The rate must be between 0 and 100 percent.');
    return;
  }
  if(!isFinite(amt) || amt < 0){
    seterr('err','Enter an amount of zero or more.');
    return;
  }
  $('custom').disabled = $('rate').value !== 'custom';
  $('modeNote').textContent = mode === 'add'
    ? 'Amount is NET - tax is added on top.'
    : 'Amount is GROSS - the tax already inside it is pulled back out.';

  var net, tax, gross;
  if(mode === 'add'){ net = amt; tax = addTax(net, rate); gross = net+tax; }
  else { gross = amt; net = netFromGross(gross, rate); tax = gross-net; }
  show([[mode==='add' ? 'Net' : 'Gross (as entered)', grp(mode==='add'?net:gross,2)],
        ['Tax', grp(tax,2)],
        [mode==='add' ? 'Gross' : 'Net (tax removed)', grp(mode==='add'?gross:net,2)],
        ['Rate', grp(rate,2)+'%']]);

  // item list
  var rows = ITEMS.map(function(v,i){
    return row([(i+1)+'. net', grp(v,2), grp(v*rate/100,2), grp(v*(1+rate/100),2)]);
  });
  var tNet = ITEMS.reduce(function(a,b){return a+b;},0);
  var tTax = tNet*rate/100;
  rows.push(row(['<b>TOTAL</b>', '<b>'+grp(tNet,2)+'</b>', '<b>'+grp(tTax,2)+'</b>',
                 '<b>'+grp(tNet+tTax,2)+'</b>']));
  $('items').innerHTML = rows.join('') ||
    row(['no items yet', '-', '-', '-']);

  $('note').textContent =
    'Adding ' + grp(rate,2) + '% to a net of 10,000 gives a gross of ' +
    grp(grossFromNet(10000,rate),2) + '. Removing ' + grp(rate,2) +
    '% from that gross has to give 10,000 back, and the only way to get there is to ' +
    'DIVIDE by ' + grp(1+rate/100,4) + ' - not to multiply by ' + grp(1-rate/100,4) +
    '. That shortcut lands on ' + grp(10000*(1-rate/100),2) + ', which overstates the ' +
    'tax by ' + grp(10000*(1-rate/100) - netFromGross(10000*(1+rate/100),rate),2) +
    ' because the rate applies to a base the shortcut never computed.';

  var sumParts = ITEMS.reduce(function(a,b){return a + b*rate/100;},0);
  $('out').textContent =
    'Rate              ' + grp(rate,2) + ' %\n' +
    'Direction         ' + (mode==='add' ? 'add tax to net' : 'remove tax from gross') + '\n' +
    'Amount entered    ' + grp(amt,2) + '\n' +
    'Net               ' + grp(net,2) + '\n' +
    'Tax               ' + grp(tax,2) + '\n' +
    'Gross             ' + grp(gross,2) + '\n' +
    'Effective tax on net  ' + (net>0 ? grp(100*tax/net,2)+'%' : 'n/a') + '\n' +
    '\n' +
    'List items        ' + ITEMS.length + '\n' +
    'List net          ' + grp(tNet,2) + '\n' +
    'List tax          ' + grp(tTax,2) + '\n' +
    'List gross        ' + grp(tNet+tTax,2) + '\n' +
    'CHECK  per-item tax sums to list tax -> ' +
      (Math.abs(sumParts - tTax) < 0.005 ? 'yes' : 'NO') + '\n' +
    'CHECK  10000 net at 7.5% -> 750.00 tax, 10750.00 gross -> ' +
      (Math.abs(grossFromNet(10000,7.5)-10750) < 0.005 ? 'yes' : 'NO') + '\n' +
    'CHECK  10750 gross at 7.5% -> 10000.00 net back -> ' +
      (Math.abs(netFromGross(10750,7.5)-10000) < 0.005 ? 'yes' : 'NO');
}
bind(['rate','custom','mode','amt'], paint);
$('li').addEventListener('keydown', function(e){ if(e.key === 'Enter') addItem(); });
paint();
</script>
</body>
</html>
