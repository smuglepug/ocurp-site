      <section class="ws-panel p-6"><div class="grid gap-4 sm:grid-cols-3"><div><label class="ws-label mb-2 block" for="d">Date</label><input id="d" type="date" class="ws-input" placeholder="2026-12-31" value="2026-12-31"></div><div><label class="ws-label mb-2 block" for="doy">Day of year (for the reverse)</label><input id="doy" type="number" class="ws-input" placeholder="1" value="1"></div><div><label class="ws-label mb-2 block" for="yr">Year for the reverse</label><select id="yr" class="ws-input !w-40"><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option></select></div></div><div class="mt-3 text-[11px] font-mono text-white/45" id="err"></div></section><div id="stats" class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4"></div><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Calendar readout</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="tbl" onclick="cp(this)">Copy</button></div><div class="overflow-x-auto"><table class="w-full text-left text-sm "><thead class="ws-label"><tr><th class="py-2 pr-4">Item</th><th class="py-2 pr-4">Value</th></tr></thead><tbody id="tbl"></tbody></table></div></section>

<!-- Mobile play mode: touch-action none on the canvas (otherwise a swipe scrolls
     the page instead of steering the game), a Fullscreen control that requests
     real fullscreen + landscape lock, and a persistent top-left Exit. Inert on
     desktop. Regenerate every game page after editing either file. -->
<link rel="stylesheet" href="/workspace/play.css?v=20261001f">
<script src="/workspace/play.js?v=20261001f" defer></script>
<script>
function cp(btn){
  var el=document.getElementById(btn.getAttribute('data-t')||'out');
  var t=el?el.textContent:'';
  try{navigator.clipboard.writeText(t)}catch(e){}
  btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy'},1200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function card(k,v){return '<div class="rounded-xl border border-white/10 bg-white/[0.04] p-4 text-center">'
 +'<div class="font-display text-xl font-black text-accent">'+esc(v)+'</div>'
 +'<div class="ws-label mt-1">'+esc(k)+'</div></div>';}
function show(list){document.getElementById('stats').innerHTML=list.map(function(p){return card(p[0],p[1])}).join('');}
function seterr(pid,msg){var e=document.getElementById(pid);if(!e)return;
  e.textContent=msg?'\u2717 '+msg:''; e.style.color=msg?'#f87171':'';}
var $=function(id){return document.getElementById(id)};
// Round to n decimals but drop a trailing -0 so 0.30000000000000004 never shows.
function r(n,d){
  if(!isFinite(n)) return String(n);
  var f=Math.pow(10,d===undefined?6:d);
  var v=Math.round(n*f)/f;
  if(Object.is(v,-0)) v=0;
  return v;
}
// Thousands separators for display; grouping is presentation only.
function grp(n,d){
  var v=r(n,d===undefined?2:d);
  var s=String(Math.abs(v));
  var parts=s.split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  // Pad to the requested decimals. Without this grp(20000,2) returned
  // '20,000' and a money column rendered as a bare integer.
  while(parts.length<2) parts.push('');
  if(d>0 && parts[1].length<d) parts[1]=(parts[1]+'0'.repeat(d)).slice(0,d);
  return (v<0?'-':'')+parts.join('.');
}
function bind(ids,fn){ids.forEach(function(id){var el=$(id);if(!el)return;
  el.addEventListener('input',fn); el.addEventListener('change',fn);});}
function wire(fn){fn();}
// Table-row builder. Cells are trusted HTML (values are escaped at the
// point they are produced), matching the Python row() used server-side.
function row(cells){return '<tr class="border-t border-white/5">'+cells.map(function(c){
  return '<td class="py-2 pr-4">'+c+'</td>';}).join('')+'</tr>';}

function leap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function dim(y,m){ return m===2 ? (leap(y)?29:28)
  : [31,28,31,30,31,30,31,31,30,31,30,31][m-1]; }
function parseD(s){var p=String(s).split('-');
  if(p.length!==3) return null;
  var y=+p[0],m=+p[1],d=+p[2];
  if(!(m>=1&&m<=12)||d<1||d>dim(y,m)) return null;
  return {y:y,m:m,d:d};
}
// ISO-8601 week date. Week 1 is the week holding Jan 4, so the week number
// is NOT simply floor((doy+weekStart-1)/7).
function isoWeek(y,m,d){
  var doy=0; for(var i=1;i<m;i++) doy+=dim(y,i);
  doy+=d;
  var wd=(new Date(y,m-1,d).getDay()+6)%7;      // 0=Mon
  var thursday=new Date(y,m-1,d+(3-wd));
  var ty=thursday.getFullYear();
  // Week 1 is the week CONTAINING Jan 4, so it begins on the Monday on or
  // before it. Measuring from Jan 4 itself (rather than from that Monday)
  // is what put 2026-01-01 in "week 0" and 2026-12-31 in "week 52".
  var jan4=new Date(ty,0,4);
  var jwd=(jan4.getDay()+6)%7;
  var wk1start=new Date(ty,0,4-jwd);
  var days=Math.round((thursday-wk1start)/86400000);
  return {year:ty, week:Math.floor(days/7)+1, weekday:wd};
}
function run(){
  var p=parseD($('d').value);
  if(!p){ seterr('err','enter a real date - 2026-02-31 is not one'); return; }
  var doy=0; for(var i=1;i<p.m;i++) doy+=dim(p.y,i);
  doy+=p.d;
  var total=leap(p.y)?366:365;
  var w=isoWeek(p.y,p.m,p.d);
  seterr('err','');
  // reverse: day-of-year -> date in $('yr')
  var y=+$('yr').value, want=parseInt($('doy').value,10);
  var back='-', remain=want, mm=1;
  if(!(want>=1&&want<=total)){ back='day '+want+' does not exist in '+y; }
  else { while(remain>dim(y,mm)){ remain-=dim(y,mm); mm++; } back=y+'-'+String(mm).padStart(2,'0')+'-'+String(remain).padStart(2,'0'); }
  window.__last = {doy:doy, isoWeek:w.week, isoYear:w.year, weekday:w.weekday,
                   leap:leap(p.y)?1:0, yearLen:total, daysLeft:total-doy, back:back};
  show([['Day of year',String(doy)],['ISO week',w.week+' of '+w.year],
        ['Days in year',String(total)],['Days left',String(total-doy)]]);
  $('tbl').innerHTML =
      row(['Date', esc($('d').value)]) +
      row(['Day of year', '<span class="text-accent">'+doy+'</span> of '+total]) +
      row(['ISO-8601 week', w.week]) +
      row(['ISO week-year', String(w.year)]) +
      row(['Weekday', ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][w.weekday]]) +
      row(['Leap year', leap(p.y)?'yes':'no']) +
      row(['Days remaining', String(total-doy)]) +
      row(['Day '+want+' of '+$('yr').value, esc(back)]);
}
// Test hook: the shared verifier calls this with a field map, then
// deep-compares the JSON it returns.
window.__T = window.__T || {};
window.__T['ordinal-date'] = function(o){ o=o||{};
  for(var k in o){ var el=document.getElementById(k); if(el) el.value=o[k]; }
  run(); return window.__last; };
bind(['d','doy','yr'], run);
run();
</script>
