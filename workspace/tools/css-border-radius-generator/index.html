<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }

<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Border Radius Generator</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Design & Colour — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">CSS</span><span class="ws-chip">SHAPE</span><span class="ws-chip">DESIGN</span></div>
        </div>
      <section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Each corner</span></div><div class="grid gap-4 sm:grid-cols-2"><div class="rounded-xl border border-white/10 bg-white/[0.04] p-3"><div class="ws-label mb-2">Top left</div><div class="flex items-center gap-2"><input id="tlh" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-white/30">×</span><input id="tlv" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-[11px] text-white/40">px W × H</span></div></div><div class="rounded-xl border border-white/10 bg-white/[0.04] p-3"><div class="ws-label mb-2">Top right</div><div class="flex items-center gap-2"><input id="trh" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-white/30">×</span><input id="trv" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-[11px] text-white/40">px W × H</span></div></div><div class="rounded-xl border border-white/10 bg-white/[0.04] p-3"><div class="ws-label mb-2">Bottom right</div><div class="flex items-center gap-2"><input id="brh" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-white/30">×</span><input id="brv" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-[11px] text-white/40">px W × H</span></div></div><div class="rounded-xl border border-white/10 bg-white/[0.04] p-3"><div class="ws-label mb-2">Bottom left</div><div class="flex items-center gap-2"><input id="blh" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-white/30">×</span><input id="blv" type="number" min="0" max="400" class="ws-input !w-24" value="24"><span class="text-[11px] text-white/40">px W × H</span></div></div></div><div class="mt-5 grid gap-4 md:grid-cols-[220px_1fr] items-center"><div id="prev" class="h-[200px] w-[200px] border border-accent/60 bg-accent/20"></div><div><div class="ws-label mb-2">CSS</div><div id="out" class="ws-out min-h-[80px]"></div><div class="mt-3 flex flex-wrap gap-3"><button id="cpy" class="ws-btn" data-for="out">Copy CSS</button><button id="blob" class="ws-btn-ghost">Organic blob</button><button id="pill" class="ws-btn-ghost">Pill</button><button id="reset" class="ws-btn-ghost">Reset</button></div></div></div></section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>function cp(b){const t=document.getElementById(b.dataset.for||'out').textContent;navigator.clipboard.writeText(t);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1200)}
const $=id=>document.getElementById(id);
const KEYS=['tl','tr','br','bl'];
function num(id){ return Math.max(0,Math.min(400,Math.round(parseFloat($(id).value)||0))); }
function run(){
  const h=KEYS.map(k=>num(k+'h')), v=KEYS.map(k=>num(k+'v'));
  // border-radius takes 1-4 values, or two slash-separated sets of 4 when the
  // width and height of a corner differ. Emitting five values is invalid CSS and
  // the browser silently drops the whole declaration, so build it properly.
  const same=h.every((x,i)=>x===v[i]);
  const bang=same
    ? h.map(x=>x+'px').join(' ')
    : h.map(x=>x+'px').join(' ')+' / '+v.map(x=>x+'px').join(' ');
  const css='border-radius: '+bang+';';
  $('prev').style.borderRadius=bang;
  $('out').textContent=css;
}
KEYS.forEach(k=>{ ['h','v'].forEach(s=>$(k+s).addEventListener('input',run)); });
$('blob').addEventListener('click',()=>{
  const sets=[[62,38,84,28],[58,72,34,66],[46,88,58,32]];
  const pick=sets[Math.floor(Math.random()*sets.length)];
  KEYS.forEach((k,i)=>{ $(k+'h').value=pick[(i)%4]; $(k+'v').value=pick[(i+1)%4]; });
  run();
});
$('pill').addEventListener('click',()=>{
  KEYS.forEach(k=>{ $(k+'h').value=999; $(k+'v').value=999; });
  run();
});
$('reset').addEventListener('click',()=>{
  KEYS.forEach(k=>{ $(k+'h').value=24; $(k+'v').value=24; });
  run();
});
run();
</script>
</body>
</html>
