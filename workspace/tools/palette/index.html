<script>const $=id=>document.getElementById(id);































function hsl(h,s,l){return 'hsl('+h+','+s+'%,'+l+'%)'}































function gen(){const c=$('c').value;































  const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255;































  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;































  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);































    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}































  s=Math.round(s*100);l=Math.round(l*100);































  const M=$('m').value;let cols=[];































  if(M==='comp')cols=[h,h,h+180,h+180,h].map((x,i)=>hsl((x+360)%360,s,[l,l,l,l,l][i]));































  else if(M==='tri')cols=[h,h+120,h+240,h+120,h+240].map(x=>hsl((x+360)%360,s,l));































  else if(M==='analog')cols=[h-40,h-20,h,h+20,h+40].map(x=>hsl((x+360)%360,s,l));































  else cols=[90,75,60,45,25].map(L=>hsl(h,s,L));































  $('sw').innerHTML=cols.map(v=>'<div class="rounded-xl border border-white/10 p-3" style="background:'+v+'"><div class="mt-10 text-[9px] font-black uppercase tracking-widest text-black/60">'+v+'</div></div>').join('')}































$('go').onclick=gen;gen();</script>
