<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Image Compressor | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Batch Image Compressor</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Design & Colour — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">IMAGE</span><span class="ws-chip">BATCH</span><span class="ws-chip">ZIP</span><span class="ws-chip">CLIENT-SIDE</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <div id="drop" class="border-2 border-dashed border-white/15 rounded-xl p-8 text-center cursor-pointer transition-colors hover:border-accent/50">
      <p class="text-sm text-white/50">Drop images here or click to choose — select as many as you like</p>
    </div>
    <input id="file" type="file" accept="image/*" multiple class="hidden">
    <div id="ctl" class="mt-6 hidden">
      <div class="flex flex-wrap items-end gap-4">
        <div><label class="ws-label mb-2 block">Compression level</label>
          <select id="lvl" class="ws-input !w-44">
            <option value="85">Light (85%)</option>
            <option value="70" selected>Balanced (70%)</option>
            <option value="50">Strong (50% + resize 1600)</option>
            <option value="30">Extreme (30% + resize 1200)</option>
          </select></div>
        <div class="flex-1 min-w-[200px]"><label class="ws-label mb-2 block">Quality: <span id="qv">70</span>%</label>
          <input id="q" type="range" min="10" max="100" value="70" class="w-full accent-[#FF5F1F]"></div>
        <div><label class="ws-label mb-2 block">Output format</label>
          <select id="fmt" class="ws-input !w-32">
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
            <option value="image/png">PNG</option>
          </select></div>
      </div>
      <div class="mt-4 flex flex-wrap gap-3">
        <button id="run" class="ws-btn">Compress all</button>
        <button id="zip" class="ws-btn">Download all as ZIP</button>
        <button id="each" class="ws-btn-ghost">Save each file</button>
        <button id="clear" class="ws-btn-ghost">Clear</button>
      </div>
      <div class="mt-3 text-xs text-white/50" id="sum"></div>
    </div>
    <div id="list" class="mt-6 space-y-2"></div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
let files=[],results=[],zips=null;
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
const baseName=n=>n.replace(/\.[^.]+$/,'');
const extOf=fmt=>fmt==='image/png'?'png':fmt==='image/webp'?'webp':'jpg';

function addFiles(list){files=files.concat([...list]);$('ctl').classList.remove('hidden');paint();}
function paint(){
  if(!files.length){$('list').innerHTML='';return}
  $('list').innerHTML=files.map((f,i)=>{
    const r=results[i];
    const right=r&&!r.err
      ? '<span class="shrink-0 text-[11px] text-white/45">'+fmtSize(f.size)+' <span class="text-accent">\\u2192</span> '+fmtSize(r.size)+'</span>'
      : '<span class="shrink-0 text-[11px] text-white/45">'+fmtSize(f.size)+'</span>';
    const sub=r&&!r.err?'<div class="mt-1 text-[11px] text-white/45">saved '+r.saved+'%  \\u00b7  similarity to original '+r.sim+'%  \\u00b7  '+(r.resized?('resized to '+r.w+'\\u00d7'+r.h):('still '+r.w+'\\u00d7'+r.h))+'</div>'
      :(r&&r.err?'<div class="mt-1 text-[11px] text-red-400">'+r.err+'</div>':'');
    return '<div class="rounded-xl border border-white/10 bg-white/[0.045] px-4 py-3">'
      +'<div class="flex items-center justify-between gap-3"><span class="truncate text-sm text-white/80">'+(i+1)+'. '+f.name+'</span>'+right+'</div>'
      +sub+'</div>';
  }).join('');
  $('sum').textContent=files.length+' image'+(files.length===1?'':'s')+' queued'+(results.length?' \\u2014 '+results.filter(r=>r&&!r.err).length+' compressed':'')+'.';
}
function level(){const v=$('lvl').value;return {q:parseInt($('q').value)/100,cap:v==='50'?1600:v==='30'?1200:0};}
function loadImg(f){return new Promise(res=>{const u=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>res({im:im,url:u});im.onerror=()=>res(null);im.src=u;});}
function similarity(a,b){const S=96;const ca=document.createElement('canvas');ca.width=ca.height=S;
  const cb=document.createElement('canvas');cb.width=cb.height=S;
  const ga=ca.getContext('2d'),gb=cb.getContext('2d');ga.drawImage(a,0,0,S,S);gb.drawImage(b,0,0,S,S);
  const da=ga.getImageData(0,0,S,S).data,db=gb.getImageData(0,0,S,S).data;let sum=0,n=0;
  for(let i=0;i<da.length;i+=4){if(da[i+3]<10&&db[i+3]<10)continue;
    sum+=Math.abs(da[i]-db[i])+Math.abs(da[i+1]-db[i+1])+Math.abs(da[i+2]-db[i+2]);n+=3}
  return n?Math.max(0,100-((sum/n)/255*100)):100;}
async function compressOne(f){
  const fmt=$('fmt').value,L=level();
  const o=await loadImg(f);
  if(!o)return {err:'Could not read this file as an image.'};
  let w=o.im.naturalWidth,h=o.im.naturalHeight;
  let resized=false;
  if(L.cap&&w>L.cap){h=Math.round(h*L.cap/w);w=L.cap;resized=true;}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(o.im,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,fmt,L.q));
  URL.revokeObjectURL(o.url);
  if(!blob)return {err:'This browser could not encode '+fmt+'.'};
  const sim=fmt==='image/png'?100:similarity(o.im,await loadBlobImg(blob));
  return {blob:blob,size:blob.size,saved:Math.round((1-blob.size/f.size)*100),sim:sim.toFixed(1),w:w,h:h,resized:resized};
}
function loadBlobImg(blob){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src=URL.createObjectURL(blob);});}
async function runAll(){
  if(!files.length)return;
  $('run').textContent='Working...';$('run').disabled=true;
  results=[];
  for(let i=0;i<files.length;i++){
    results[i]=await compressOne(files[i]);
    paint();
  }
  $('run').textContent='Compress all';$('run').disabled=false;
  const ok=results.filter(r=>r&&!r.err);
  const before=ok.reduce((s,r,i)=>s+files[i].size,0);
  const after=ok.reduce((s,r)=>s+r.size,0);
  if(ok.length)$('sum').textContent=ok.length+' of '+files.length+' compressed \\u00b7 '+fmtSize(before)+' \\u2192 '+fmtSize(after)+' \\u00b7 '+Math.round((1-after/before)*100)+'% smaller overall';
}
function saveBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function ext(){return extOf($('fmt').value);}
$('each').onclick=()=>{
  const ok=results.filter(r=>r&&r.blob);
  if(!ok.length){$('sum').textContent='Press "Compress all" first.';return}
  ok.forEach((r,i)=>setTimeout(()=>saveBlob(r.blob,baseName(files[results.indexOf(r)].name)+'-min.'+ext()),i*450));
  $('sum').textContent='Saving '+ok.length+' file'+(ok.length===1?'':'s')+' to your downloads...';
};
$('zip').onclick=async()=>{
  const ok=results.filter(r=>r&&r.blob);
  if(!ok.length){$('sum').textContent='Press "Compress all" first.';return}
  $('zip').textContent='Building ZIP...';
  try{
    if(!window.JSZip){await new Promise((res,rej)=>{const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=rej;
      document.head.appendChild(s);});}
    const z=new JSZip();
    results.forEach((r,i)=>{if(r&&r.blob)z.file(baseName(files[i].name)+'-min.'+ext(),r.blob);});
    const out=await z.generateAsync({type:'blob',compression:'DEFLATE'});
    saveBlob(out,'compressed-images.zip');
    $('sum').textContent='ZIP saved ('+fmtSize(out.size)+', '+ok.length+' images).';
  }catch(e){
    $('sum').textContent='ZIP library unavailable - using "Save each file" instead.';
    $('each').click();
  }
  $('zip').textContent='Download all as ZIP';
};
$('clear').onclick=()=>{files=[];results=[];$('list').innerHTML='';$('ctl').classList.add('hidden');$('sum').textContent='';};
$('run').onclick=runAll;
$('lvl').addEventListener('change',()=>{$('q').value=$('lvl').value;});
$('q').addEventListener('input',()=>{$('qv').textContent=$('q').value;});
$('qv').textContent=$('q').value;
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files);e.target.value='';};
['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('border-accent/50')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('border-accent/50')}));
$('drop').addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
paint();
</script>
</body>
</html>
