<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">JWT Inspector</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data & Code — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">JWT</span><span class="ws-chip">CLAIMS</span><span class="ws-chip">EXPIRY</span></div>
        </div>
      <section class="ws-panel p-6"><div><label class="ws-label mb-2 block" for="src">Paste a JWT</label><textarea id="src" class="ws-input font-mono" rows="6" placeholder="eyJhbGciOi..."></textarea></div><div class="mt-4 flex flex-wrap items-center gap-4"><button id="sample" class="ws-btn">Load a sample token</button><button id="clr" class="ws-btn-ghost">Clear</button></div><div class="mt-3 text-[11px] font-mono text-white/45" id="err"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Header</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="hdr" onclick="cp(this)">Copy</button></div><div class="mb-3 flex items-center justify-between"><span class="ws-label">Header</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="hdr" onclick="cp(this)">Copy</button></div><div id="hdr" class="ws-out"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Payload</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="pay" onclick="cp(this)">Copy</button></div><div class="mb-3 flex items-center justify-between"><span class="ws-label">Payload</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="pay" onclick="cp(this)">Copy</button></div><div id="pay" class="ws-out"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Claim timeline</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="" onclick="cp(this)"></button></div><div class="mb-3 flex items-center justify-between"><span class="ws-label">Claim timeline</span></div><div id="tl" class="space-y-2"></div><div id="stats" class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4"></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Notes</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="notes" onclick="cp(this)">Copy</button></div><div class="mb-3 flex items-center justify-between"><span class="ws-label">Notes</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="notes" onclick="cp(this)">Copy</button></div><div id="notes" class="ws-out"></div></section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/tools/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
function cp(btn){
  var el=document.getElementById(btn.getAttribute('data-t')||'out');
  var t=el?el.textContent:'';
  try{navigator.clipboard.writeText(t)}catch(e){}
  btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy'},1200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function card(k,v){return '<div class="rounded-xl border border-white/10 bg-white/[0.04] p-4 text-center">'
 +'<div class="font-display text-xl font-black text-accent">'+v+'</div>'
 +'<div class="ws-label mt-1">'+k+'</div></div>';}
function show(list){document.getElementById('stats').innerHTML=list.map(function(p){return card(p[0],p[1])}).join('');}
var $=function(id){return document.getElementById(id)};

function b64urlToText(seg){
  var s=String(seg).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  var bin=atob(s);
  var bytes=[]; for(var i=0;i<bin.length;i++) bytes.push(bin.charCodeAt(i));
  return new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(bytes));
}
function textToB64url(obj){
  var s=typeof obj==='string'?obj:JSON.stringify(obj);
  var bytes=new TextEncoder().encode(s), bin='';
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
var SEC_ALGS={HS256:'HMAC with SHA-256',HS384:'HMAC with SHA-384',HS512:'HMAC with SHA-512',
  RS256:'RSA PKCS#1 v1.5 with SHA-256',RS384:'RSA PKCS#1 v1.5 with SHA-384',
  RS512:'RSA PKCS#1 v1.5 with SHA-512',ES256:'ECDSA P-256 with SHA-256',ES384:'ECDSA P-384 with SHA-384',
  ES512:'ECDSA P-521 with SHA-512',PS256:'RSA-PSS with SHA-256',EdDSA:'Ed25519'};
var DATE_CLAIMS=['iat','nbf','exp','auth_time','updated_at'];
var CLAIM_HELP={
  iss:'issuer', sub:'subject (user id)', aud:'audience', jti:'unique token id',
  exp:'expiry - after this instant the token is invalid', iat:'issued at',
  nbf:'not before - the token is invalid before this instant',
  scope:'granted scopes, space separated', azp:'authorised party',
  roles:'roles carried in the token', email:'user email', name:'display name',
  iss_uri:'issuer identifier URI', client_id:'the OAuth client this was issued to'
};
function fmtUtc(sec){
  var d=new Date(sec*1000);
  if(isNaN(d.getTime())) return '\u2014';
  return d.toISOString().replace('T',' ').replace(/\.\d{3}Z$/,' UTC');
}
function relative(sec, nowSec){
  var delta=sec-nowSec, past=delta<0;
  var a=Math.abs(delta), s=Math.floor(a), parts=[];
  var d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), ss=s%60;
  if(d) parts.push(d+'d'); if(h) parts.push(h+'h'); if(m) parts.push(m+'m');
  if(!d && !h) parts.push(ss+'s');
  var txt=parts.slice(0,2).join(' ')||'0s';
  return past? txt+' ago' : 'in '+txt;
}
function decode(token){
  var parts=String(token).trim().split('.');
  if(parts.length!==3) throw new Error('A JWT has 3 dot-separated parts, found '+parts.length);
  var header, payload;
  try{ header=JSON.parse(b64urlToText(parts[0])); }
  catch(e){ throw new Error('header is not valid base64url JSON'); }
  try{ payload=JSON.parse(b64urlToText(parts[1])); }
  catch(e){ throw new Error('payload is not valid base64url JSON'); }
  return {header:header, payload:payload, signature:parts[2]};
}
function inspect(token, nowMs){
  var d=decode(token);
  var nowSec=Math.floor((nowMs===undefined?Date.now():nowMs)/1000);
  var alg=d.header.alg||'(none)';
  var claims=Object.keys(d.payload).filter(function(k){
    return typeof d.payload[k]==='number' && DATE_CLAIMS.indexOf(k)>=0;
  }).sort(function(a,b){
    return (d.payload[a]-(d.payload[a]>=1e12?1e12:0))-(d.payload[b]-(d.payload[b]>=1e12?1e12:0));
  });
  var notes=[], timeline=[];
  if(alg==='none') notes.push('alg is "none" - the token carries no signature and must never be trusted.');
  else if(SEC_ALGS[alg]) notes.push('alg '+alg+' = '+SEC_ALGS[alg]+'.');
  else notes.push('alg "'+alg+'" is not a recognised JWS algorithm.');
  if(d.header.typ && d.header.typ.toUpperCase()!=='JWT')
    notes.push('typ is "'+d.header.typ+'", not JWT - usually fine, but worth knowing.');
  if(d.signature.length===0) notes.push('The signature segment is empty.');
  if(typeof d.payload.exp==='number'){
    timeline.push({k:'exp', at:d.payload.exp, state:d.payload.exp<=nowSec?'expired':'valid until'});
    if(d.payload.exp<=nowSec) notes.push('Expired '+relative(d.payload.exp,nowSec)+' ('+fmtUtc(d.payload.exp)+').');
    else notes.push('Valid for another '+relative(d.payload.exp,nowSec).replace('in ','')+'.');
  } else notes.push('No exp claim - the token never expires on its own.');
  if(typeof d.payload.iat==='number'){
    timeline.push({k:'iat', at:d.payload.iat, state:'issued'});
    notes.push('Issued '+fmtUtc(d.payload.iat)+' ('+relative(d.payload.iat,nowSec)+').');
  }
  if(typeof d.payload.nbf==='number'){
    timeline.push({k:'nbf', at:d.payload.nbf, state:d.payload.nbf>nowSec?'not yet valid':'active'});
    if(d.payload.nbf>nowSec) notes.push('Not valid for another '+relative(d.payload.nbf,nowSec).replace('in ','')+'.');
  }
  if(typeof d.payload.exp==='number' && typeof d.payload.iat==='number'){
    var life=d.payload.exp-d.payload.iat;
    notes.push('Lifetime: '+life+'s ('+(life>=86400? (life/86400).toFixed(2)+' days' : (life/3600).toFixed(2)+' hours')+').');
  }
  var unknown=Object.keys(d.payload).filter(function(k){ return !CLAIM_HELP[k]; });
  if(unknown.length) notes.push('Custom claims: '+unknown.join(', ')+'.');
  return {header:d.header, payload:d.payload, signature:d.signature, alg:alg,
          notes:notes, timeline:timeline, parts:3,
          expState: (typeof d.payload.exp!=='number') ? 'no exp'
                    : (d.payload.exp<=nowSec ? 'EXPIRED' : 'valid')};
}
function sampleToken(){
  return textToB64url({alg:'HS256',typ:'JWT',kid:'ocurp-key-3'})
    + '.' + textToB64url({iss:'https://ocurp.space',sub:'usr_8412',aud:'workspace',
        iat:1767225600, nbf:1767225600, exp:1767312000, jti:'tok_9f2c1a',
        scope:'tools:read tools:write', email:'owen@ocurp.space', name:'Owen Osayi'})
    + '.' + 'hK3nQx7bYt1sZpWvRmDc8JfLgAeNiUoXyT6bQ9sV2mEcA4dR7tH0kP3w';
}
function run(){
  var err=$('err'), raw=$('src').value.trim();
  err.textContent=''; err.style.color='';
  if(!raw){ $('hdr').textContent=$('pay').textContent=$('notes').textContent='';
            $('tl').innerHTML=''; show([]); return; }
  var r;
  try{ r=inspect(raw); }
  catch(e){ err.textContent='\u2717 '+e.message; err.style.color='#f87171';
            $('hdr').textContent=$('pay').textContent=$('notes').textContent='';
            $('tl').innerHTML=''; show([]); return; }
  $('hdr').textContent=JSON.stringify(r.header,null,2);
  $('pay').textContent=JSON.stringify(r.payload,null,2);
  $('notes').textContent=r.notes.map(function(n){ return '\u2022 '+n; }).join('\n');
  var nowSec=Math.floor(Date.now()/1000);
  var items=r.timeline.concat([{k:'now', at:nowSec, state:'now'}])
    .sort(function(a,b){ return a.at-b.at; });
  $('tl').innerHTML = items.map(function(it){
    var colour = it.k==='now' ? '#e0f2fe' : (it.state.indexOf('expired')>=0 ? '#f87171' : '#4ade80');
    return '<div class="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-white/10 bg-white/[0.04] px-4 py-2.5">'
      +'<span class="ws-label" style="min-width:3.5rem">'+it.k+'</span>'
      +'<span class="font-mono text-white/70">'+fmtUtc(it.at)+'</span>'
      +'<span class="font-mono text-xs" style="color:'+colour+'">'+it.state+'</span></div>';
  }).join('') || '<div class="text-white/30">No date claims in this token.</div>';
  show([['Algorithm', r.alg],['State', r.expState],['Claims', Object.keys(r.payload).length],
        ['Signature bytes', Math.floor(r.signature.length*3/4)],
        ['Payload bytes', Math.floor(String(raw).split('.')[1].length*3/4)],
        ['Header bytes', Math.floor(String(raw).split('.')[0].length*3/4)]]);
}
$('sample').onclick=function(){ $('src').value=sampleToken(); run(); };
$('clr').onclick=function(){ $('src').value=''; run(); };
$('src').addEventListener('input',run);
window.__jwt={inspect:inspect,decode:decode,fmtUtc:fmtUtc,relative:relative,
              sampleToken:sampleToken,textToB64url:textToB64url,b64urlToText:b64urlToText,run:run};
$('src').value=sampleToken();
run();
</script>
</body>
</html>
