<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Builder | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Cron Builder</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data &amp; Code — Client-side</p>
    </div>
    <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">CRON</span><span class="ws-chip">SCHEDULE</span><span class="ws-chip">CLIENT-SIDE</span></div>
  </div>
  <section class="ws-panel p-6">
    <div class="mb-4">
      <label class="ws-label mb-2 block">Raw expression (type or paste to decode)</label>
      <input id="raw" class="ws-input font-mono text-lg" placeholder="*/15 * * * *" value="*/15 * * * *">
    </div>
    <div class="text-[11px] font-mono" id="rawErr" style="color:#f87171"></div>
    <div class="mt-4 grid gap-4 md:grid-cols-5">
      <div><label class="ws-label mb-2 block">Minute</label><select id="min" class="ws-input"></select></div>
      <div><label class="ws-label mb-2 block">Hour</label><select id="hour" class="ws-input"></select></div>
      <div><label class="ws-label mb-2 block">Day</label><select id="dom" class="ws-input"></select></div>
      <div><label class="ws-label mb-2 block">Month</label><select id="mon" class="ws-input"></select></div>
      <div><label class="ws-label mb-2 block">Weekday</label><select id="dow" class="ws-input"></select></div>
    </div>
    <div class="mt-4 flex flex-wrap gap-3">
      <button id="copy" class="ws-btn">Copy expression</button>
      <button id="common1" class="ws-btn-ghost">Daily midnight</button>
      <button id="common2" class="ws-btn-ghost">Every 15 min</button>
      <button id="common3" class="ws-btn-ghost">Weekly Sun</button>
    </div>
    <div class="ws-panel ws-copy mt-4 p-4"><div class="mb-2 flex items-center justify-between"><span class="ws-label">Expression</span><button class="ws-btn-ghost !px-3 !py-1.5" onclick="cp(this)">Copy</button></div><pre id="out" class="ws-out font-mono text-lg"></pre></div>
    <div class="mt-4 ws-panel p-4">
      <div class="ws-label mb-2">Plain English</div>
      <div id="english" class="ws-out text-sm"></div>
    </div>
    <div class="mt-4 ws-panel p-4">
      <div class="ws-label mb-2">Next 5 run times</div>
      <div id="nextRuns" class="ws-out text-sm space-y-1"></div>
    </div>
  </section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
function cp(b){const t=document.getElementById('out').textContent;navigator.clipboard.writeText(t);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1200)}
const $=id=>document.getElementById(id);
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

function fieldDesc(v,field){
  if(v==='*')return 'every '+field;
  if(v==='L')return 'the last day of the month';
  if(v.startsWith('*/'))return 'every '+parseInt(v.slice(2))+' '+field+'s';
  if(v.includes('-')){const[a,b]=v.split('-');return 'from '+field+' '+a+' through '+b}
  if(v.includes(',')){const parts=v.split(',');return 'on '+field+'s '+parts.join(', ')}
  if(/^\d+$/.test(v)){
    if(field==='weekday')return DOW[parseInt(v)]||v;
    if(field==='month')return MON[parseInt(v)-1]||v;
    return 'on '+field+' '+v;
  }
  return v;
}

function buildEnglish(vals){
  const[mi,ho,dom,mo,dow]=vals;
  const parts=[];
  if(mi==='*'&&ho==='*')parts.push('every minute');
  else if(ho==='*')parts.push('at minute '+descField(mi));
  else {
    let t='';
    if(mi!=='*')t+='at minute '+descField(mi);
    if(ho!=='*'){if(t)t+=', ';t+='past hour '+descField(ho)}
    parts.push(t);
  }
  if(dow!=='*'&&dom!=='*')parts.push('on '+fieldDesc(dow,'weekday')+' and day '+dom+' of '+fieldDesc(mo,'month'));
  else if(dow!=='*')parts.push('on every '+fieldDesc(dow,'weekday'));
  else if(dom!=='*')parts.push('on day '+fieldDesc(dom,'day')+' of '+fieldDesc(mo,'month'));
  else if(mo!=='*')parts.push('in '+fieldDesc(mo,'month'));
  return parts.join(', ')+'.';
}
function descField(v){return v==='*'?'0':v}

function parseField(v,min,max){
  if(v==='*')return Array.from({length:max-min+1},(_,i)=>i+min);
  if(v==='L')return [31];
  if(v.startsWith('*/')){const step=parseInt(v.slice(2));const r=[];for(let i=min;i<=max;i+=step)r.push(i);return r}
  if(v.includes('-')){const[a,b]=v.split('-').map(Number);const r=[];for(let i=a;i<=b;i++)r.push(i);return r}
  if(v.includes(','))return v.split(',').map(Number);
  if(/^\d+$/.test(v))return [parseInt(v)];
  return [0];
}

function nextRuns(expr,n){
  try{
    const[mi,ho,dom,mo,dow]=expr.split(/\s+/).slice(0,5);
    const miV=parseField(mi,0,59),hoV=parseField(ho,0,23),domV=parseField(dom,1,31),moV=parseField(mo,1,12),dowV=parseField(dow,0,6);
    const now=new Date();now.setSeconds(0,0);now.setMinutes(now.getMinutes()+1);
    const runs=[];let d=new Date(now);let count=0;
    for(let i=0;i<5000&&count<n;i++){
      const m=d.getMinutes(),h=d.getHours(),dm=d.getDate(),mon=d.getMonth()+1,dw=d.getDay();
      if(miV.includes(m)&&hoV.includes(h)&&domV.includes(dm)&&moV.includes(mon)&&dowV.includes(dw)){
        runs.push(d.toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
        count++;
      }
      d=new Date(d.getTime()+60000);
    }
    return runs;
  }catch(e){return['Unable to calculate']}
}

const MIN_OPTS=['0','5','10','15','20','25','30','45','*/2','*/5','*/10','*/15','*/30','*'];
const HOUR_OPTS=['0','1','3','6','9','12','15','18','21','23','*/2','*/6','*/12','*'];
const DOM_OPTS=['*','1','2','15','28','L'];
const MON_OPTS=['*','1','4','7','10','12'];
const DOW_OPTS=['*','0','1','2','3','4','5','6','1-5','0,6'];

function fillSelect(id,opts,cur){
  const sel=$(id);
  if(!sel.children.length)opts.forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o;sel.appendChild(opt)});
  if(opts.includes(cur))sel.value=cur;
}
fillSelect('min',MIN_OPTS,'*');fillSelect('hour',HOUR_OPTS,'*');fillSelect('dom',DOM_OPTS,'*');fillSelect('mon',MON_OPTS,'*');fillSelect('dow',DOW_OPTS,'*');

function syncFromRaw(){
  const v=$('raw').value.trim();
  const parts=v.split(/\s+/).slice(0,5);
  if(parts.length<5){$('rawErr').textContent='Need 5 fields (minute hour day month weekday)';return}
  $('rawErr').textContent='';
  fillSelect('min',MIN_OPTS,parts[0]||'*');fillSelect('hour',HOUR_OPTS,parts[1]||'*');fillSelect('dom',DOM_OPTS,parts[2]||'*');fillSelect('mon',MON_OPTS,parts[3]||'*');fillSelect('dow',DOW_OPTS,parts[4]||'*');
  build();
}

function build(){
  $('rawErr').textContent='';
  const vals=['min','hour','dom','mon','dow'].map(id=>$(id).value);
  const expr=vals.join(' ');
  $('raw').value=expr;
  $('out').textContent=expr;
  $('english').textContent=buildEnglish(vals);
  const runs=nextRuns(expr,5);
  $('nextRuns').innerHTML=runs.map((r,i)=>'<span class="text-white/70">'+(i+1)+'.</span> <span>'+r+'</span>').join('<br>');
}
['min','hour','dom','mon','dow'].forEach(id=>$(id).addEventListener('change',build));
$('raw').addEventListener('input',syncFromRaw);
$('copy').onclick=()=>{navigator.clipboard.writeText($('out').textContent);$('copy').classList.add('ok');setTimeout(()=>$('copy').classList.remove('ok'),1200)};
$('common1').onclick=()=>{$('min').value='0';$('hour').value='0';$('dom').value='*';$('mon').value='*';$('dow').value='*';build()};
$('common2').onclick=()=>{$('min').value='*/15';$('hour').value='*';$('dom').value='*';$('mon').value='*';$('dow').value='*';build()};
$('common3').onclick=()=>{$('min').value='0';$('hour').value='0';$('dom').value='*';$('mon').value='*';$('dow').value='0';build()};
build();
</script>
</body>
</html>
