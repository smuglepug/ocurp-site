      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Data & Code — Client-side</p>
          </div>

      <section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">YAML</span></div><div><label class="ws-label mb-2 block" for="src">YAML document</label><textarea id="src" rows="10" class="ws-input font-mono text-xs" placeholder="name: Owen
age: 27
tags:
  - design
  - data
nested:
  ok: true
  list: [1, 2, 3]">name: Owen
age: 27
tags:
  - design
  - data
nested:
  ok: true
  list: [1, 2, 3]</textarea></div><div class="mt-4 flex flex-wrap items-center gap-3"><button id="go" class="ws-btn">Validate</button><button id="fix" class="ws-btn-ghost">Strip tabs</button><label class="flex items-center gap-2 text-xs text-white/70"><input id="strict" type="checkbox" class="ws-input" style="width:auto"> Strict indentation</label><span class="text-xs text-white/50" id="cnt"></span></div></section><div class="mt-5"><div class="ws-label mb-2">Errors and warnings</div><div id="out" class="ws-out"></div></div><div class="mt-5"><div class="ws-label mb-2">Parsed structure</div><div id="tree" class="ws-out"></div></div>

  <div class="mt-10 border-t border-white/5 pt-6 text-center">

<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
// Small YAML reader: block maps, block lists, inline flow, scalars, comments.
// Enough to validate and draw the structure of hand-written config files.
function tokenize(src){
  const raw=src.split(/\r?\n/), items=[];
  for(let i=0;i<raw.length;i++){
    const line=raw[i];
    if(/^\s*$/.test(line)){ items.push({n:i+1,blank:true}); continue; }
    if(/^\s*#/.test(line)){ items.push({n:i+1,comment:line.trim()}); continue; }
    if(/^\s*---/.test(line)||/^\s*\.\.\.\s*$/.test(line)){ items.push({n:i+1,doc:true}); continue; }
    const m=line.match(/^(\s*)(.*)$/);
    const indent=m[1].replace(/\t/g,'  ').length;
    items.push({n:i+1,indent:indent,text:m[2],tab:/\t/.test(m[1])});
  }
  return items;
}
function scalar(v){
  v=v.trim();
  if(v==='' ) return null;
  if(/^"[^"]*"$/.test(v)||/^'[^']*'$/.test(v)) return v.slice(1,-1);
  if(/^-?\d+$/.test(v)) return parseInt(v,10);
  if(/^-?\d*\.\d+$/.test(v)) return parseFloat(v);
  if(v==='true'||v==='True') return true;
  if(v==='false'||v==='False') return false;
  if(v==='null'||v==='~') return null;
  if(/^\[.*\]$/.test(v)) return v.slice(1,-1).split(',').map(s=>scalar(s));
  if(/^\{.*\}$/.test(v)){
    const o={}; v.slice(1,-1).split(',').forEach(p=>{const k=p.split(':');if(k.length>1)o[k[0].trim()]=scalar(k.slice(1).join(':'));});
    return o;
  }
  return v;
}
function run(){
  const src=$('src').value, items=tokenize(src), errs=[];
  const strict=$('strict').checked;
  for(const it of items){
    if(it.tab) errs.push({lvl:'error',n:it.n,m:'Tab character in indentation - YAML forbids tabs.'});
    if(!it.text||it.blank||it.comment||it.doc) continue;
    if(/^\s*-/.test(it.text)){
      const rest=it.text.replace(/^\s*-\s*/,'');
      if(rest && !/^[\w"'\-[\{]/.test(rest)) errs.push({lvl:'error',n:it.n,m:'Unexpected character after the list dash.'});
      continue;
    }
    if(!/^[^\s:][^:]*:(\s|$)/.test(it.text)){
      errs.push({lvl:'error',n:it.n,m:'Not a "key: value" pair and not a list item.'});
      continue;
    }
    if(/:\s*$/.test(it.text)===false && /:(?! )/.test(it.text)){
      errs.push({lvl:'warn',n:it.n,m:'No space after the colon - add one.'});
    }
    if(strict){
      const prev=items.filter(p=>p.text&&!p.blank&&!p.comment).slice(-1)[0];
    }
  }
  // duplicate keys at the same indent
  const seen={};
  for(const it of items){
    if(!it.text||it.blank||it.comment||it.doc) continue;
    const m=it.text.match(/^([^\s:#][^:]*):/);
    if(!m) continue;
    const k=it.indent+'|'+m[1].trim();
    if(seen[k]) errs.push({lvl:'error',n:it.n,m:'Duplicate key "'+m[1].trim()+'" (first seen on line '+seen[k]+').'});
    else seen[k]=it.n;
  }
  if(!errs.length) errs.push({lvl:'ok',n:0,m:'Valid YAML - no structural problems found.'});
  $('out').textContent=errs.map(e=>(e.n?'Line '+e.n+': ':'')+'['+e.lvl.toUpperCase()+'] '+e.m).join('\n');
  // structure tree
  const lines=[];
  let lastIndent=null;
  for(const it of items){
    if(it.blank||it.doc) continue;
    if(it.comment){ lines.push('  '.repeat(Math.max(0,it.indent))+'# '+it.comment.slice(1)); continue; }
    if(it.text && /^[\w"'\-/.]/.test(it.text) && it.text.includes(':')){
      const i=it.text.indexOf(':'), k=it.text.slice(0,i), v=it.text.slice(i+1).trim();
      lines.push('  '.repeat(it.indent)+k+': '+(v||'{...}'));
    } else if(it.text && /^\s*-/.test(it.text)){
      lines.push('  '.repeat(it.indent)+'- '+it.text.replace(/^\s*-\s*/,''));
    } else {
      lines.push('  '.repeat(it.indent||0)+it.text);
    }
    lastIndent=it.indent;
  }
  $('tree').textContent=lines.join('\n')||'(empty document)';
  $('cnt').textContent=items.filter(i=>!i.blank).length+' line'+(items.filter(i=>!i.blank).length===1?'':'s')+', '
    +errs.filter(e=>e.lvl==='error').length+' error'+(errs.filter(e=>e.lvl==='error').length===1?'':'s')+'.';
}
$('go').addEventListener('click',run);
$('src').addEventListener('input',run);
$('fix').addEventListener('click',()=>{
  $('src').value=$('src').value.replace(/\t/g,'  '); run();
});
run();
</script>
