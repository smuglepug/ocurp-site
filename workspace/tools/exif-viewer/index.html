<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXIF Viewer | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">EXIF Viewer</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Design & Colour — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">EXIF</span><span class="ws-chip">JPEG</span><span class="ws-chip">METADATA</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <label class="ws-label mb-2 block">Upload a JPEG with EXIF data</label>
    <div id="drop" class="rounded-xl border-2 border-dashed border-white/15 p-8 text-center cursor-pointer hover:border-accent/50 transition-colors">
      <p class="text-sm text-white/40">Drop or click to upload a JPG/JPEG</p>
      <input id="file" type="file" accept="image/jpeg" class="hidden">
    </div>
    <div id="results" class="mt-4 hidden">
      <div class="grid gap-4 md:grid-cols-[160px_1fr]">
        <div class="rounded-xl border border-white/10 bg-white/[0.03] p-3">
          <img id="thumb" class="w-full rounded-lg">
        </div>
        <div>
          <div class="mb-3 flex gap-3">
            <button id="strip" class="ws-btn-ghost">Strip EXIF & Download</button>
          </div>
          <div class="ws-label mb-2">EXIF Data</div>
          <div id="exifRows" class="space-y-1.5 max-h-[400px] overflow-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),file=$('file');
let exifData={},lastBlob=null;
// Minimal EXIF parser (reads JPEG APP1 marker)
function parseExif(buf){
  const u8=new Uint8Array(buf),data={};
  if(u8[0]!==0xFF||u8[1]!==0xD8)return null;
  let i=2;
  while(i<u8.length){
    if(u8[i]!==0xFF)break;
    const marker=u8[i+1];
    if(marker===0xD9)break;
    if(marker===0xE1){
      const len=(u8[i+2]<<8)|u8[i+3];
      // Check for "Exif" string
      let str='';
      for(let j=4;j<10;j++)str+=String.fromCharCode(u8[i+j]);
      if(str==='Exif\x00\x00'){
        const tiffOffset=i+10;
        const endian=u8[tiffOffset]===0x4D?'big':'little';
        const read16=(o)=>endian==='big'?(u8[o]<<8)|u8[o+1]:(u8[o+1]<<8)|u8[o];
        const read32=(o)=>endian==='big'?(u8[o]<<24)|(u8[o+1]<<16)|(u8[o+2]<<8)|u8[o+3]:(u8[o+3]<<24)|(u8[o+2]<<16)|(u8[o+1]<<8)|u8[o];
        const tiffEnd=tiffOffset+read16(tiffOffset+2);
        const ifd0Offset=tiffOffset+read32(tiffOffset+4);
        const cnt=read16(ifd0Offset);
        let o=ifd0Offset+2;
        for(let e=0;e<cnt;e++){
          const tag=read16(o),type=read16(o+2),count=read32(o+4),valOffset=o+8;
          const typeName=['','BYTE','ASCII','SHORT','LONG','RATIONAL','SBYTE','UNDEFINED','SSHORT','SLONG','SRATIONAL','FLOAT','DOUBLE'][type]||'?';
          let val='';
          if(type===2){
            let s='';for(let k=0;k<count;k++)s+=String.fromCharCode(u8[valOffset+k]);
            val=s.replace(/\x00/g,'').trim();
          }else if(type===3){
            val=read16(valOffset);
          }else if(type===4){
            val=read32(valOffset);
          }else if(type===5){
            val=read32(valOffset)+'/'+read32(valOffset+4);
          }else if(type===7){
            let s='';for(let k=0;k<count;k++)s+=String.fromCharCode(u8[valOffset+k]);
            val=s.replace(/\x00/g,'').trim();
          }
          const tags={0x010E:'ImageDescription',0x010F:'Make',0x0110:'Model',0x011A:'XResolution',0x011B:'YResolution',0x0128:'ResolutionUnit',0x0131:'Software',0x0132:'DateTime',0x013B:'Artist',0x8769:'ExifOffset',0x8298:'Copyright',0x0112:'Orientation'};
          if(tags[tag])data[tags[tag]]=val;
          o+=12;
        }
        // Exif sub-IFD
        if(data.ExifOffset){
          const exifO=tiffOffset+parseInt(data.ExifOffset);
          const ec=read16(exifO);
          let eo=exifO+2;
          for(let e=0;e<ec;e++){
            const tag=read16(eo),type=read16(eo+2),count=read32(eo+4),valOffset=eo+8;
            let val='';
            if(type===2||type===7){let s='';for(let k=0;k<count;k++)s+=String.fromCharCode(u8[valOffset+k]);val=s.replace(/\x00/g,'').trim()}
            else if(type===3)val=read16(valOffset);
            else if(type===4)val=read32(valOffset);
            else if(type===5)val=read32(valOffset)+'/'+read32(valOffset+4);
            else if(type===10)val=read32(valOffset)+'/'+read32(valOffset+4);
            const tags={0x9000:'ExifVersion',0x9003:'DateTimeOriginal',0x9004:'DateTimeDigitized',0x920A:'FocalLength',0x9207:'ExposureMode',0x9208:'WhiteBalance',0x9209:'Flash',0xA002:'PixelXDimension',0xA003:'PixelYDimension',0xA210:'FocalPlaneXResolution',0x829A:'ExposureTime',0x829D:'FNumber',0x8822:'ExposureProgram',0x8827:'ISOSpeedRatings',0x9201:'ShutterSpeedValue',0x9202:'ApertureValue',0x9204:'ExposureBiasValue',0x9205:'MaxApertureValue',0x9206:'SubjectDistance'};
            if(tags[tag])data[tags[tag]]=val;
            eo+=12;
          }
        }
      }
    }
    if(marker>=0xD0&&marker<=0xD7)break;
    if(marker===0xDA)break;
    if(marker>=0xC0&&marker<=0xCF){
      const segLen=(u8[i+2]<<8)|u8[i+3];i+=2+segLen;
    }else{
      const segLen=(u8[i+2]<<8)|u8[i+3];
      if(segLen<2)break;
      i+=2+segLen;
    }
  }
  return data;
}
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('border-accent')};
drop.ondragleave=()=>drop.classList.remove('border-accent');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('border-accent');if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0])};
file.onchange=()=>file.files[0]&&handle(file.files[0]);
function handle(f){
  if(!f.type.includes('jpeg')&&!f.type.includes('jpg')){alert('EXIF data is only in JPEG files — please upload a .jpg');return}
  const r=new FileReader();
  r.onload=()=>{
    exifData=parseExif(r.result)||{};
    lastBlob=r.result;
    $('thumb').src=URL.createObjectURL(new Blob([r.result],{type:f.type}));
    const rows=Object.entries(exifData).filter(([k])=>k!=='ExifOffset');
    if(rows.length===0){
      $('exifRows').innerHTML='<div class="text-sm text-white/30 py-4">No EXIF data found in this image.</div>';
    }else{
      $('exifRows').innerHTML=rows.map(([k,v])=>
        '<div class="flex gap-4 rounded-lg border border-white/10 bg-white/[0.04] px-3 py-2"><span class="ws-label min-w-[140px] shrink-0">'+k+'</span><span class="ws-out">'+v+'</span></div>').join('');
    }
    $('results').classList.remove('hidden');
  };
  r.readAsArrayBuffer(f);
}
$('strip').onclick=()=>{
  if(!lastBlob)return;
  const u8=new Uint8Array(lastBlob);
  // Strip all APP markers, keep only image data
  const out=[];
  out.push(0xFF,0xD8);
  let i=2;
  while(i<u8.length){
    if(u8[i]!==0xFF)break;
    const m=u8[i+1];
    if(m===0xD9){i++;break}
    if(m===0xDA){out.push(0xFF,0xDA);for(let j=i+2;j<u8.length;j++)out.push(u8[j]);break}
    if(m===0x00){i+=2;continue}
    if(m>=0xD0&&m<=0xD7){i+=2;continue}
    if(m>=0xC0&&m<=0xCF){
      const len=(u8[i+2]<<8)|u8[i+3];i+=2+len;
    }else if(m===0xDB||m===0xC4){
      const len=(u8[i+2]<<8)|u8[i+3];for(let j=0;j<2+len;j++)out.push(u8[i+j]);i+=2+len;
    }else{
      const len=(u8[i+2]<<8)|u8[i+3];i+=2+len;
    }
  }
  out.push(0xFF,0xD9);
  const blob=new Blob([new Uint8Array(out)],{type:'image/jpeg'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stripped.jpg';a.click();
};
</script>
</body>
</html>
