<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Tag Generator | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Meta Tag Generator</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Network & Web — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">OPEN GRAPH</span><span class="ws-chip">TWITTER</span><span class="ws-chip">SEO</span></div>
        </div>
      <section class="ws-panel p-6"><div><label class="ws-label mb-2 block" for="url">Page URL</label><input id="url" type="text" class="ws-input" placeholder="https://example.com/page" value="https://ocurp.space/workspace/tools/meta-tag-generator"></div><div class="mt-4 grid gap-4 md:grid-cols-2"><div><label class="ws-label mb-2 block" for="title">Title</label><input id="title" type="text" class="ws-input" placeholder="Page title (60 chars max)" value="Owen's Workspace - Client-side Tools"></div><div><label class="ws-label mb-2 block" for="desc">Description</label><input id="desc" type="text" class="ws-input" placeholder="A short summary" value="Browse calculators, converters and games that run entirely in the browser."></div><div class="md:col-span-2 grid gap-4 sm:grid-cols-2"><div><label class="ws-label mb-2 block" for="img">Image URL (1200x630)</label><input id="img" type="text" class="ws-input" placeholder="https://example.com/og.png" value="https://ocurp.space/workspace/tools/logos/meta-tag-generator.png"></div><div><label class="ws-label mb-2 block" for="site">Site name</label><input id="site" type="text" class="ws-input" placeholder="Example Site" value="ocurp.space"></div></div></div><div class="mt-4 flex flex-wrap items-center gap-5"><div><label class="ws-label mb-2 block" for="tw">Twitter @site</label><input id="tw" type="text" class="ws-input" placeholder="@ocurp" value="@ocurp"></div><div><label class="ws-label mb-2 block" for="card">Card</label><select id="card" class="ws-input !w-44"><option value="summary_large_image">summary_large_image</option><option value="summary">summary</option></select></div><label class="flex items-center gap-2 text-sm text-white/70"><input id="noesc" type="checkbox" class="accent-[#FF5F1F]"> Skip HTML escaping</label><label class="flex items-center gap-2 text-sm text-white/70"><input id="jsonld" type="checkbox" checked class="accent-[#FF5F1F]"> Include JSON-LD</label></div></section><div id="stats" class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4"></div><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">Card preview</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="out" onclick="cp(this)">Copy all</button></div><div class="rounded-xl border border-white/10 bg-[#0d0d0d] p-5"><div id="prev" class="max-w-[600px]"></div></div></section><section class="ws-panel mt-4 p-5"><div class="mb-3 flex items-center justify-between"><span class="ws-label">HTML tags</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="code" onclick="cp(this)">Copy tags</button></div><div class="mb-3 flex items-center justify-between"><span class="ws-label">HTML tags</span><button class="ws-btn-ghost !px-3 !py-1.5" data-t="code" onclick="cp(this)">Copy tags</button></div><div id="code" class="ws-out"></div></section>
  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/tools/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
function cp(btn){
  var el=document.getElementById(btn.getAttribute('data-t')||'out');
  var t=el?el.textContent:'';
  try{navigator.clipboard.writeText(t)}catch(e){}
  btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy'},1200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function card(k,v){return '<div class="rounded-xl border border-white/10 bg-white/[0.04] p-4 text-center">'
 +'<div class="font-display text-xl font-black text-accent">'+v+'</div>'
 +'<div class="ws-label mt-1">'+k+'</div></div>';}
function show(list){document.getElementById('stats').innerHTML=list.map(function(p){return card(p[0],p[1])}).join('');}
var $=function(id){return document.getElementById(id)};
function pad(n,w){var s=String(n);while(s.length<w)s='0'+s;return s;}

function metaAttrs(el, attrs){
  var s='<'+el;
  for(var k in attrs){ if(attrs[k]!=='' && attrs[k]!==undefined) s+=' '+k+'="'+attrs[k]+'"'; }
  return s+'>';
}
// Everything inside a meta content attribute must be entity-escaped or the
// tag breaks the moment a title contains an ampersand or a quote.
function escAttr(s){
  if($('noesc').checked) return String(s);
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function titleCount(n){ return n<=60 ? 'ok ('+n+'/60)' : 'over by '+(n-60); }
function descCount(n){ return n<=160 ? 'ok ('+n+'/160)' : 'over by '+(n-160); }
function build(){
  var url=$('url').value.trim()||'https://example.com/page';
  var title=$('title').value, desc=$('desc').value, img=$('img').value.trim();
  var site=$('site').value.trim(), tw=$('tw').value.trim();
  var cardType=$('card').value;
  var lines=[];
  lines.push('<title>'+escAttr(title)+'</title>');
  lines.push(metaAttrs('meta',{name:'description',content:escAttr(desc)}));
  lines.push(metaAttrs('meta',{property:'og:type',content:'website'}));
  lines.push(metaAttrs('meta',{property:'og:url',content:escAttr(url)}));
  lines.push(metaAttrs('meta',{property:'og:title',content:escAttr(title)}));
  lines.push(metaAttrs('meta',{property:'og:description',content:escAttr(desc)}));
  lines.push(metaAttrs('meta',{property:'og:site_name',content:escAttr(site)}));
  if(img) lines.push(metaAttrs('meta',{property:'og:image',content:escAttr(img)}));
  if(img) lines.push(metaAttrs('meta',{property:'og:image:width',content:'1200'}));
  if(img) lines.push(metaAttrs('meta',{property:'og:image:height',content:'630'}));
  lines.push(metaAttrs('meta',{name:'twitter:card',content:cardType}));
  lines.push(metaAttrs('meta',{name:'twitter:title',content:escAttr(title)}));
  lines.push(metaAttrs('meta',{name:'twitter:description',content:escAttr(desc)}));
  if(tw) lines.push(metaAttrs('meta',{name:'twitter:site',content:escAttr(tw)}));
  if(img) lines.push(metaAttrs('meta',{name:'twitter:image',content:escAttr(img)}));
  if($('jsonld').checked){
    var ld={};
    ld['@context']='https://schema.org';
    ld['@type']='WebSite';
    ld.name = site || title;
    ld.url = url;
    if(desc) ld.description = desc;
    lines.push('<script type="application/ld+json">'
      +JSON.stringify(ld,null,2)+'</'+'script>');
  }
  var code=lines.join('\n');

  var host='';
  try{ host=new URL(url).hostname; }catch(e){ host=url; }
  var big = cardType==='summary_large_image' && img;
  $('prev').innerHTML =
      '<div class="flex gap-3">'
    + '<div class="flex h-[110px] w-[110px] flex-none items-center justify-center overflow-hidden rounded-lg border border-white/10 bg-white/[0.04]">'
    + (img ? '<img src="'+escAttr(img)+'" class="h-full w-full object-cover" alt="">'
           : '<span class="text-xs text-white/30">no image</span>')
    + '</div>'
    + '<div class="min-w-0">'
    + '<div class="truncate text-xs uppercase text-white/50">'+esc(host)+'</div>'
    + '<div class="mt-1 line-clamp-2 font-display text-lg font-bold leading-snug">'+esc(title)+'</div>'
    + '<div class="mt-1 line-clamp-2 text-sm text-white/60">'+esc(desc)+'</div>'
    + '</div></div>'
    + '<div class="mt-4 rounded-lg border border-white/10 bg-white/[0.03] p-3 text-[11px] text-white/55">'
    + (big?'Large image card - fills most of a timeline.':'Small card - image sits left, text wraps beside it.')
    + '</div>';

  $('code').textContent=code;
  var tagCount=code.split('\n').length;
  var bytes=new Blob([code]).size;
  show([['Tags',tagCount-($('jsonld').checked?1:0)],
        ['Code bytes',bytes],
        ['Title',titleCount(title.length)],
        ['Description',descCount(desc.length)]]);
  return code;
}
['url','title','desc','img','site','tw'].forEach(function(id){
  $(id).addEventListener('input',build);
});
$('card').addEventListener('change',build);
$('noesc').addEventListener('change',build);
$('jsonld').addEventListener('change',build);
window.__meta={build:build,escAttr:escAttr,metaAttrs:metaAttrs,
               titleCount:titleCount,descCount:descCount};
build();
</script>
</body>
</html>
