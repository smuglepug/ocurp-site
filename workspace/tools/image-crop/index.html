<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/tools/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Tools
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Image Cropper</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Design & Colour — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">IMAGE</span><span class="ws-chip">CROP</span><span class="ws-chip">HANDLE</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <div id="drop" class="border-2 border-dashed border-white/15 rounded-xl p-8 text-center cursor-pointer transition-colors hover:border-accent/50">
      <p class="text-sm text-white/50">Drop or click to upload an image</p>
    </div>
    <input id="file" type="file" accept="image/*" class="hidden">
    <div id="controls" class="mt-6 hidden">
      <div class="flex flex-wrap items-end gap-4">
        <div><label class="ws-label mb-2 block">Aspect ratio</label>
          <select id="ratio" class="ws-input !w-40"><option value="0">Free</option><option value="1">1:1 Square</option><option value="1.7778">16:9</option><option value="1.3333">4:3</option><option value="0.5625">9:16</option><option value="0.6667">2:3</option><option value="1.5">3:2</option></select></div>
        <div><label class="ws-label mb-2 block">Format</label>
          <select id="fmt" class="ws-input !w-32"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="ws-label mb-1 block">X</label><input id="nx" type="number" class="ws-input !w-20 font-mono" value="0"></div>
          <div><label class="ws-label mb-1 block">Y</label><input id="ny" type="number" class="ws-input !w-20 font-mono" value="0"></div>
          <div><label class="ws-label mb-1 block">W</label><input id="nw" type="number" class="ws-input !w-20 font-mono" value="100"></div>
          <div><label class="ws-label mb-1 block">H</label><input id="nh" type="number" class="ws-input !w-20 font-mono" value="100"></div>
        </div>
        <button id="dl" class="ws-btn">Download</button>
      </div>
      <div class="mt-4 relative inline-block overflow-hidden rounded-xl">
        <canvas id="cv" class="max-w-full block"></canvas>
        <div id="cropbox" class="absolute border-2 border-accent bg-accent/10 cursor-move" style="display:none">
          <div class="handle handle-nw absolute -top-1 -left-1 w-3 h-3 bg-accent rounded-sm cursor-nwse-resize"></div>
          <div class="handle handle-ne absolute -top-1 -right-1 w-3 h-3 bg-accent rounded-sm cursor-nesw-resize"></div>
          <div class="handle handle-sw absolute -bottom-1 -left-1 w-3 h-3 bg-accent rounded-sm cursor-nesw-resize"></div>
          <div class="handle handle-se absolute -bottom-1 -right-1 w-3 h-3 bg-accent rounded-sm cursor-nwse-resize"></div>
        </div>
      </div>
      <div class="mt-2 text-xs text-white/50" id="cropInfo"></div>
    </div>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>function cp(b){const t=document.getElementById('out').textContent;navigator.clipboard.writeText(t);b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),1200)}
const $=id=>document.getElementById(id);
let imgEl=null,cw=0,ch=0;
let bx=0,by=0,bw=100,bh=100,dragMode=null,dragStart={x:0,y:0};
const cv=$('cv'),cx=cv.getContext('2d'),box=$('cropbox');
const drop=$('drop'),file=$('file');
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('border-accent')};
drop.ondragleave=()=>drop.classList.remove('border-accent');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('border-accent');if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0])};
file.onchange=e=>{if(e.target.files[0])handle(e.target.files[0])};
function handle(f){
  const url=URL.createObjectURL(f);
  imgEl=new Image();imgEl.onload=()=>{
    const maxW=600;let w=imgEl.naturalWidth,h=imgEl.naturalHeight;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
    cv.width=w;cv.height=h;cw=w;ch=h;
    cx.drawImage(imgEl,0,0,w,h);
    bw=Math.round(w*0.6);bh=Math.round(h*0.6);bx=Math.round(w*0.2);by=Math.round(h*0.2);
    applyRatio();updateBox();$('controls').classList.remove('hidden');
  };imgEl.src=url;
}
function applyRatio(){
  const r=parseFloat($('ratio').value);
  if(r>0){bh=Math.round(bw/r);if(by+bh>ch)bh=ch-by;if(bh<10)bh=10}
}
function updateBox(){
  box.style.display='block';
  box.style.left=bx+'px';box.style.top=by+'px';
  box.style.width=bw+'px';box.style.height=bh+'px';
  $('nx').value=Math.round(bx*imgEl.naturalWidth/cw);
  $('ny').value=Math.round(by*imgEl.naturalHeight/ch);
  $('nw').value=Math.round(bw*imgEl.naturalWidth/cw);
  $('nh').value=Math.round(bh*imgEl.naturalHeight/ch);
  $('cropInfo').textContent='Crop: '+Math.round(bw*imgEl.naturalWidth/cw)+' × '+Math.round(bh*imgEl.naturalHeight/ch);
}
function getPos(e){
  const r=cv.getBoundingClientRect();
  const cx2=e.touches?e.touches[0].clientX:e.clientX;
  const cy2=e.touches?e.touches[0].clientY:e.clientY;
  return{x:cx2-r.left,y:cy2-r.top};
}
box.addEventListener('mousedown',e=>{
  if(e.target.classList.contains('handle')){dragMode=e.target.classList[1];e.preventDefault();return}
  e.preventDefault();dragMode='move';dragStart=getPos(e);
});
box.addEventListener('touchstart',e=>{
  if(e.target.classList.contains('handle')){dragMode=e.target.classList[1];e.preventDefault();return}
  e.preventDefault();dragMode='move';dragStart=getPos(e);
},{passive:false});
document.addEventListener('mousemove',e=>{
  if(!dragMode)return;const p=getPos(e);
  if(dragMode==='move'){bx=Math.max(0,Math.min(cw-bw,p.x-dragStart.x));by=Math.max(0,Math.min(ch-bh,p.y-dragStart.y));}
  else if(dragMode==='handle-se'||dragMode==='handle-nw'){
    const dx=p.x-dragStart.x,dy=p.y-dragStart.y;
    if(dragMode==='handle-se'){bw=Math.max(20,Math.min(cw-bx,bw+dx));bh=Math.max(20,Math.min(ch-by,bh+dy));}
    else{const nbx=Math.max(0,bx+dx),nby=Math.max(0,by+dy);bw=Math.max(20,bw-(nbx-bx));bh=Math.max(20,bh-(nby-by));bx=nbx;by=nby;}
    applyRatio();
  }
  else if(dragMode==='handle-ne'||dragMode==='handle-sw'){
    const dx=p.x-dragStart.x,dy=p.y-dragStart.y;
    if(dragMode==='handle-ne'){const nby=Math.max(0,by+dy);bh=Math.max(20,bh-(nby-by));by=nby;bw=Math.max(20,Math.min(cw-bx,bw+dx));}
    else{const nbx=Math.max(0,bx+dx);bw=Math.max(20,bw-(nbx-bx));bx=nbx;bh=Math.max(20,Math.min(ch-by,bh+dy));}
    applyRatio();
  }
  updateBox();
});
document.addEventListener('touchmove',e=>{
  if(!dragMode)return;e.preventDefault();const p=getPos(e);
  if(dragMode==='move'){bx=Math.max(0,Math.min(cw-bw,p.x-dragStart.x));by=Math.max(0,Math.min(ch-bh,p.y-dragStart.y));}
  else{
    const dx=p.x-dragStart.x,dy=p.y-dragStart.y;
    if(dragMode==='handle-se'){bw=Math.max(20,Math.min(cw-bx,bw+dx));bh=Math.max(20,Math.min(ch-by,bh+dy));}
    else if(dragMode==='handle-nw'){const nbx=Math.max(0,bx+dx),nby=Math.max(0,by+dy);bw=Math.max(20,bw-(nbx-bx));bh=Math.max(20,bh-(nby-by));bx=nbx;by=nby;}
    else if(dragMode==='handle-ne'){const nby=Math.max(0,by+dy);bh=Math.max(20,bh-(nby-by));by=nby;bw=Math.max(20,Math.min(cw-bx,bw+dx));}
    else{const nbx=Math.max(0,bx+dx);bw=Math.max(20,bw-(nbx-bx));bx=nbx;bh=Math.max(20,Math.min(ch-by,bh+dy));}
    applyRatio();
  }
  updateBox();
},{passive:false});
document.addEventListener('mouseup',()=>dragMode=null);
document.addEventListener('touchend',()=>dragMode=null);
cv.addEventListener('mousedown',e=>{
  if(!imgEl)return;e.preventDefault();const p=getPos(e);
  bx=p.x;by=p.y;bw=20;bh=20;dragMode='handle-se';dragStart=p;
  const move=ev=>{const pp=getPos(ev);bw=Math.max(20,Math.min(cw-bx,pp.x-bx));bh=Math.max(20,Math.min(ch-by,pp.y-by));applyRatio();updateBox()};
  const up=()=>{dragMode=null;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
});
$('ratio').addEventListener('change',()=>{applyRatio();updateBox()});
['nx','ny','nw','nh'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    if(!imgEl)return;
    bx=parseInt($('nx').value)*cw/imgEl.naturalWidth||0;
    by=parseInt($('ny').value)*ch/imgEl.naturalHeight||0;
    bw=parseInt($('nw').value)*cw/imgEl.naturalWidth||20;
    bh=parseInt($('nh').value)*ch/imgEl.naturalHeight||20;
    if(parseFloat($('ratio').value)>0)bh=bw/parseFloat($('ratio').value);
    updateBox();
  });
});
$('dl').onclick=()=>{
  const sx=imgEl.naturalWidth/cw,sy=imgEl.naturalHeight/ch;
  const c=document.createElement('canvas');c.width=Math.round(bw*sx);c.height=Math.round(bh*sy);
  c.getContext('2d').drawImage(imgEl,bx*sx,by*sy,bw*sx,bh*sy,0,0,bw*sx,bh*sy);
  const a=document.createElement('a');a.href=c.toDataURL($('fmt').value);a.download='cropped.'+$('fmt').value.split('/')[1];a.click();
};
</script>
</body>
</html>
