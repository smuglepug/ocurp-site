<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
// ---------------------------------------------------------------------------
// GRID. 9x9 cells of 44px. Row 0 is the nest bank, row 8 the launch bank,
// rows 1..7 are water. The runner stands in ONE fixed column (AGENT_COL) and
// only ever moves up the grid, so the whole game is a 1-D timing puzzle on
// each lane. Fixed step, no frame-rate dependence at all.
// ---------------------------------------------------------------------------
const COLS=9, ROWS=9, CELL=44, W=COLS*CELL, H=ROWS*CELL;
const TICK=0.02;            // one simulation step, seconds
const PERIOD=12;            // the whole river repeats every 12 s
const TICKS=Math.round(PERIOD/TICK);   // 600 steps per full period
const HOP_TICKS=8;          // a hop takes 8 steps = 0.16 s
const AGENT_COL=4, AGENT_W=22, AGENT_H=22;
const AGENT_X=AGENT_COL*CELL+(CELL-AGENT_W)/2;   // 187
const AGENT_DY=(CELL-AGENT_H)/2;                 // 11
const START_ROW=8, HOME_ROW=0, WATER_ROWS=7;

// Every lane's lattice pitch divides v*PERIOD exactly, so each lane's log
// pattern is periodic with the SAME 12 s period. That is what lets the
// planner below search residue space and be certain no route was missed.
const LANE_SPEC=[
  {row:1, v: 40, pitch:120, len: 76},
  {row:2, v:-56, pitch:112, len: 70},
  {row:3, v: 32, pitch: 96, len: 64},
  {row:4, v:-72, pitch:108, len: 70},
  {row:5, v: 48, pitch: 96, len: 60},
  {row:6, v:-64, pitch: 96, len: 62},
  {row:7, v: 56, pitch: 96, len: 64}
];
const mod=(a,b)=>((a%b)+b)%b;
const secs=t=>t*TICK;

let LANES=[];              // {row,v,pitch,len,phi}
let row=START_ROW, tick=0, air=0, phase='ready', tries=0, wins=0;
let plan=null, planAt=null, routeOn=false, logLines=[];

// --- field geometry, the ONLY place positions are computed -----------------
function basePhase(i,t){ const L=LANES[i]; return mod(L.phi+L.v*t, L.pitch); }
function logX(i,t,k){ return basePhase(i,t)+k*LANES[i].pitch; }
// k from -1..4 covers the 396px board for every pitch in LANE_SPEC
function onLog(i,t){
  const L=LANES[i], b=basePhase(i,t);
  for(let k=-1;k<=4;k++){
    const x=b+k*L.pitch;
    if(x<AGENT_X+AGENT_W && x+L.len>AGENT_X) return true;
  }
  return false;
}
// Steps until the log carrying the runner reaches the end of its pass. This is
// the real "you got swept away" limit; the planner is not allowed to ignore it.
function coverEnd(i,t){
  let e=t;
  while(e-t<TICKS && onLog(i,secs(e))) e++;
  return e;
}
// A landing spot must also survive MARGIN more steps than the hop itself, so
// there is real reaction slack rather than a frame-exact thread to walk.
const MARGIN=20;
function canStand(i,t){ return onLog(i,secs(t)) && (coverEnd(i,t)-t)>=HOP_TICKS+MARGIN; }

// --- generator -------------------------------------------------------------
// Draws a random phase per lane, then refuses to ship a river the planner
// cannot solve. The prover re-derives the same plan independently.
function makeField(rng){
  const f=()=>typeof rng==='function'?rng():Math.random();
  for(let attempt=0;attempt<80;attempt++){
    LANES=LANE_SPEC.map(s=>({row:s.row,v:s.v,pitch:s.pitch,len:s.len,phi:f()*s.pitch}));
    if(solve()) return {ok:true,attempt:attempt+1};
  }
  return {ok:false,attempt:80};
}

// --- planner ---------------------------------------------------------------
// Exact search over (lane, tick-residue). The river is PERIOD-periodic, so a
// plan is a list of landing residues. Returns the landing tick of every hop,
// or null. Lane 0 and lane 8 (the banks) are always safe, so the first hop
// may be taken at any time and the last hop always succeeds.
function solve(){
  const ok=[];                              // per lane: Set of landable residues
  const pre=[];
  for(let i=0;i<WATER_ROWS;i++){
    const s=new Set(), p=new Map();
    for(let t=0;t<TICKS;t++) if(canStand(i,t)){ s.add(t); p.set(t,-1); }
    ok.push(s); pre.push(p);
  }
  if(!ok[0].size) return null;
  const prev=[new Set(ok[0])];
  for(let i=1;i<WATER_ROWS;i++){
    const cur=new Set(), from=new Map();
    for(let t=0;t<TICKS;t++){
      if(!ok[i].has(t)) continue;
      for(const a of prev[i-1]){
        const head=coverEnd(i-1,a);
        if(t>=a+HOP_TICKS && t<=a+head){ cur.add(t); from.set(t,a); break; }
      }
    }
    if(!cur.size) return null;
    prev.push(cur); pre[i]=from;
  }
  let best=-1;
  for(const t of prev[WATER_ROWS-1]) if(best<0||t<best) best=t;
  if(best<0) return null;
  const out=[];
  let t=best;
  for(let i=WATER_ROWS-1;i>=0;i--){ out[i]=t; t=pre[i].get(t); }
  return out;
}

// --- simulation ------------------------------------------------------------
function newRiver(){
  tick=0; air=0; row=START_ROW; phase='play'; plan=null; planAt=null;
  return true;
}
function start(){
  makeField();
  newRiver();
  plan=solve();
  $('go').style.display='none';
  logLines=[];
  upd();
  last=0; acc0=0; requestAnimationFrame(frame);
}
function press(){
  if(phase==='ready'){ start(); return; }
  if(phase!=='play'||air>0) return;
  if(row===HOME_ROW) return;
  air=HOP_TICKS;
  if(planAt) planAt=planAt.slice();
}
function land(){
  row--;
  tickNow();
  if(row===HOME_ROW){ phase='won'; wins++; logLines.push('t='+tick+': reached the nest'); }
  else{
    const i=row-1;
    if(!onLog(i,secs(tick))){ phase='lost'; logLines.push('t='+tick+': lane '+row+' was empty underfoot'); }
    else if(planAt) planAt.shift();
  }
}
function tickNow(){
  if(air>0){ air--; if(air===0) land(); return; }
  if(phase==='play'&&row>HOME_ROW&&row<START_ROW){
    if(!onLog(row-1,secs(tick))){ phase='lost'; tries++; logLines.push('t='+tick+': swept off lane '+row); }
  }
}
function step(){ tick++; tickNow(); }

// Replay an arbitrary press schedule through the REAL geometry and report
// what actually happens. This is what the browser check asserts on.
function simulate(pressAt, maxTick){
  let r=START_ROW, t=0, a=0, res={won:false,lost:false,reason:'',ticks:0};
  const end=maxTick||(TICKS*3);
  const P=pressAt.slice().sort((x,y)=>x-y);
  let pi=0;
  while(t<end){
    t++;
    if(pi<P.length&&P[pi]===t){ a=HOP_TICKS; pi++; }
    if(a>0){ a--; if(a===0){
      r--;
      if(r===HOME_ROW){ res.won=true; res.reason='nest'; res.ticks=t; return res; }
      if(!onLog(r-1,secs(t))){ res.lost=true; res.reason='empty'; res.ticks=t; return res; }
    } continue; }
    if(r>HOME_ROW&&r<START_ROW&&!onLog(r-1,secs(t))){ res.lost=true; res.reason='swept'; res.ticks=t; return res; }
  }
  res.ticks=t; res.reason='timeout'; return res;
}

// --- drawing ---------------------------------------------------------------
const cv=$('cv'), cx=cv.getContext('2d');
function sized(){
  const r=cv.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(440*dpr); cv.height=Math.round(440*dpr);
  cx.setTransform(dpr*(440/W),0,0,dpr*(440/W),0,0);
}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function draw(){
  cx.clearRect(0,0,W,H);
  cx.fillStyle='#050505'; cx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++){
    const bank=(r===HOME_ROW||r===START_ROW);
    cx.fillStyle=bank?'rgba(255,255,255,.045)':(r%2?'rgba(255,255,255,.02)':'rgba(255,255,255,.035)');
    cx.fillRect(0,r*CELL,W,CELL);
    if(bank){
      cx.fillStyle='rgba(255,255,255,.14)';
      cx.fillRect(0,r===HOME_ROW?0:START_ROW*CELL+0,W,1);
    }
  }
  // survey line
  cx.fillStyle='rgba(255,255,255,.07)';
  cx.fillRect(AGENT_COL*CELL+AGENT_DY,0,AGENT_W,H);
  // logs
  for(let i=0;i<WATER_ROWS;i++){
    const L=LANES[i], b=basePhase(i,secs(tick));
    for(let k=-1;k<=4;k++){
      const x=b+k*L.pitch;
      if(x+L.len<0||x>W) continue;
      rr(x,L.row*CELL+3,L.len,CELL-6,7);
      cx.fillStyle='#161616'; cx.fill();
      cx.strokeStyle='rgba(255,255,255,.13)'; cx.lineWidth=1; cx.stroke();
      cx.fillStyle='rgba(255,255,255,.05)';
      cx.fillRect(x+6,L.row*CELL+7,L.len-12,3);
    }
  }
  // nest
  const ny=HOME_ROW*CELL+AGENT_DY;
  cx.beginPath(); cx.arc(AGENT_X+AGENT_W/2,ny+AGENT_H/2,AGENT_W/2-1,0,Math.PI*2);
  cx.strokeStyle=phase==='won'?'#FF5F1F':'rgba(255,95,31,.5)'; cx.lineWidth=2; cx.stroke();
  // route hint
  if(routeOn&&plan){
    for(let i=0;i<plan.length;i++){
      const L=LANE[i], p=mod(plan[i],TICKS), x=AGENT_X;
      if(onLog(i,secs(p))) continue;
      cx.fillStyle='rgba(255,95,31,.75)';
      cx.fillRect(x+2,L.row*CELL+8,AGENT_W-4,4);
    }
  }
  // runner
  if(phase!=='ready'&&!(phase==='lost'&&tick%20<8)){
    const ry=row*CELL+AGENT_DY-(air>0?10:0);
    rr(AGENT_X,ry,AGENT_W,AGENT_H,4);
    cx.fillStyle=phase==='lost'?'#7a3a18':'#FF5F1F'; cx.fill();
  }
  cx.fillStyle='rgba(255,255,255,.22)'; cx.font='9px IBM Plex Sans, monospace';
  for(let i=0;i<WATER_ROWS;i++) cx.fillText('L'+(i+1),6,LANES[i].row*CELL+15);
}
function upd(){
  $('lanc').textContent='LANE '+row+' / 7';
  $('tries').textContent='TRIES '+tries;
  $('stat').textContent = phase.toUpperCase();
  $('stat').style.color = phase==='won'?'#FF5F1F':(phase==='lost'?'#FF5F1F':'');
  $('trace').textContent =
    'row      '+row+'  ('+(row===HOME_ROW?'nest':row===START_ROW?'launch bank':'lane '+(row))+')\n'
    +'step     '+tick+'  =  '+secs(tick).toFixed(2)+' s of '+PERIOD+' s period\n'
    +'lattice  '+LANES.map((L,i)=>'L'+(i+1)+' '+L.len+'px/'+L.pitch+'px @'+L.v+'px/s').join('\n         ')
    +'\nplan     '+(plan?plan.map((t,i)=>'L'+(i+1)+'@'+secs(t).toFixed(2)+'s').join('  '):'none');
  S.state=phase;S.row=row;S.tick=tick;
}
let last=0;
function frame(ts){
  if(!last) last=ts;
  let d=(ts-last)/1000; last=ts;
  if(d>0.25) d=0.25;
  let acc=acc0+d; if(d>0.25) acc=acc0+TICK;
  let guard=0;
  while(acc>=TICK && guard++<40){ step(); acc-=TICK; }
  acc0=acc;
  draw(); upd();
  requestAnimationFrame(frame);
}
var acc0=0;
addEventListener('resize',sized);
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); press(); } });
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
document.querySelectorAll('[data-act=hop]').forEach(b=>b.onclick=press);
$('go').onclick=start;
$('rs').onclick=start;
$('hint').onclick=()=>{ routeOn=!routeOn; $('hint').textContent=routeOn?'Hide route':'Show route'; plan=solve(); upd(); };
const S={state:'ready',row:START_ROW,tick:0,phase:'ready'};
window.__river_crosser={
  COLS:()=>COLS, ROWS:()=>ROWS, CELL:()=>CELL, TICK:()=>TICK, TICKS:()=>TICKS,
  PERIOD:()=>PERIOD, HOP_TICKS:()=>HOP_TICKS, AGENT_COL:()=>AGENT_COL,
  AGENT_X:()=>AGENT_X, AGENT_W:()=>AGENT_W, AGENT_H:()=>AGENT_H,
  WATER_ROWS:()=>WATER_ROWS, START_ROW:()=>START_ROW, HOME_ROW:()=>HOME_ROW,
  get state(){return S.state;}, get row(){return S.row;}, get tick(){return S.tick;},
  lanes:()=>LANES.map(L=>({row:L.row,v:L.v,pitch:L.pitch,len:L.len,phi:L.phi})),
  onLog:onLog, coverEnd:coverEnd, canStand:canStand, solve:solve,
  simulate:simulate, press:press, start:start, reset:()=>{S.state='ready';phase='ready';}
};
LANES=LANE_SPEC.map(s=>({row:s.row,v:s.v,pitch:s.pitch,len:s.len,phi:s.pitch*0.25}));
sized(); plan=solve(); draw(); upd(); S.state='ready';
</script>
