<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Sand | Owen's Workspace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  .font-mono { font-family:'IBM Plex Sans',monospace; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }
  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }
  .ws-btn:hover { opacity:.9 }
  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }
  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }
  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }
  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }
  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }
  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">
  <div class="mb-8 flex flex-wrap items-center gap-4">
    <a href="/workspace/games/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Games
    </a>
    <div class="min-w-0">
      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Falling Sand</h1>
      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Game — Client-side</p>
          </div>
          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">SANDBOX</span><span class="ws-chip">SIM</span><span class="ws-chip">CANVAS</span></div>
        </div>
      
  <section class="ws-panel p-6">
    <div class="mb-4 flex flex-wrap items-center gap-2" id="pal"></div>
    <div class="mb-4 flex flex-wrap items-center gap-3">
      <label class="ws-label">Brush <span id="bs">4</span></label>
      <input id="brush" type="range" min="1" max="12" value="4" class="w-40 accent-[#FF5F1F]">
      <button id="pause" class="ws-btn-ghost">Pause</button>
      <button id="clear" class="ws-btn-ghost">Clear</button>
      <span class="ws-chip" id="info">0 cells</span>
    </div>
    <canvas id="cv" class="w-full touch-none rounded-xl border border-white/15" style="image-rendering:pixelated;aspect-ratio:3/2"></canvas>
    <p class="mt-3 text-xs text-white/45">Click and drag to pour. Sand piles up, water flows and pools, fire spreads through wood and oil, plants grow near water, acid eats solids, lava melts ice into water.</p>
  </section>

  <div id="ws-more" class="mt-12"></div>
  <div class="mt-10 border-t border-white/5 pt-6 text-center">
    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>
  </div>
</div>
<script src="/workspace/related.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const W=200,H=133;
let g=new Uint8Array(W*H), life=new Uint8Array(W*H);
const cv=$('cv'); cv.width=W; cv.height=H;
const cx=cv.getContext('2d');
const img=cx.createImageData(W,H);
const EL=[
 ['Sand',1,[196,180,132]],['Water',2,[54,116,214]],['Stone',3,[110,110,118]],
 ['Wood',4,[122,84,48]],['Fire',5,[255,95,31]],['Smoke',6,[110,110,110]],
 ['Oil',7,[76,58,40]],['Plant',8,[70,160,80]],['Acid',9,[150,230,70]],
 ['Ice',10,[150,210,255]],['Lava',11,[220,90,30]]
];
const CMAP={0:[13,13,13]}; EL.forEach(e=>CMAP[e[1]]=e[2]);
let paint=1, brush=4, running=true;
$('pal').innerHTML=EL.map(e=>'<button data-e="'+e[1]+'" class="ws-btn-ghost !px-3 !py-2">'+e[0]+'</button>').join('')
  +'<button data-e="0" class="ws-btn-ghost !px-3 !py-2">Erase</button>';
$('pal').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return; paint=+b.dataset.e;
  [...$('pal').children].forEach(c=>c.className='ws-btn-ghost !px-3 !py-2');
  b.className='ws-btn !px-3 !py-2';
});
$('brush').addEventListener('input',ev=>{brush=+ev.target.value;$('bs').textContent=brush});
$('pause').addEventListener('click',()=>{running=!running;$('pause').textContent=running?'Pause':'Resume'});
$('clear').addEventListener('click',()=>{g.fill(0);life.fill(0)});
const get=(x,y)=>(x<0||y<0||x>=W||y>=H)?-1:g[y*W+x];
const set=(x,y,v)=>{if(x<0||y<0||x>=W||y>=H)return;g[y*W+x]=v};
let down=false;
function pos(e){const r=cv.getBoundingClientRect();
  return [Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]}
function splat(x,y,v){
  for(let dy=-brush;dy<=brush;dy++)for(let dx=-brush;dx<=brush;dx++){
    if(dx*dx+dy*dy>brush*brush)continue;
    const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const i=ny*W+nx; g[i]=v;
    life[i]= v===5?80 : v===6?50 : 0;
  }
}
cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e); splat(p[0],p[1],paint)});
cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);splat(p[0],p[1],paint)});
window.addEventListener('pointerup',()=>{down=false});
window.addEventListener('pointercancel',()=>{down=false});
const SOLID={3:1,4:1,8:1,10:1};
function step(){
  for(let y=H-1;y>=0;y--){
    const flip=Math.random()<0.5;
    for(let k=0;k<W;k++){
      const x=flip?k:W-1-k, i=y*W+x, t=g[i]; if(!t) continue;
      const below=get(x,y+1), dl=get(x-1,y+1), dr=get(x+1,y+1);
      const side=Math.random()<0.5?-1:1;
      if(t===1){                                   // sand: powder
        if(below===0||below===2||below===5||below===7||below===9){ set(x,y,below===0?0:below); set(x,y+1,1); }
        else if(dl===0||dl===2||dl===9){ const v=dl; set(x,y,v===0?0:v); set(x-1,y+1,1); }
        else if(dr===0||dr===2||dr===9){ const v=dr; set(x,y,v===0?0:v); set(x+1,y+1,1); }
      } else if(t===2||t===7||t===9||t===11){      // liquids
        const visc = (t===7||t===11) ? 0.5 : 1;
        if(Math.random()>visc) continue;
        if(t===9){                                  // acid dissolves solids
          for(const [ax,ay] of [[0,1],[-1,1],[1,1],[0,-1]]){
            const s=get(x+ax,y+ay);
            if(SOLID[s]&&Math.random()<0.35){ set(x+ax,y+ay,0); set(x,y,0); break; }
          }
          if(!g[i]) continue;
        }
        if(t===11){                                 // lava ignites + cools
          for(const [ax,ay] of [[0,1],[-1,0],[1,0],[0,-1]]){
            const s=get(x+ax,y+ay);
            if(s===4||s===8||s===7){ set(x+ax,y+ay,5); life[(y+ay)*W+(x+ax)]=80; }
            if(s===10){ set(x+ax,y+ay,2); }
          }
          if(Math.random()<0.004){ set(x,y,3); continue; }
        }
        if(below===0||below===5||below===6){ set(x,y,below===0?0:below); set(x,y+1,t); }
        else if(dl===0){ set(x,y,0); set(x-1,y+1,t); }
        else if(dr===0){ set(x,y,0); set(x+1,y+1,t); }
        else {
          const sx=get(x+side,y);
          if(sx===0){ set(x,y,0); set(x+side,y,t); }
        }
      } else if(t===5){                            // fire
        for(const [ax,ay] of [[0,1],[-1,0],[1,0],[0,-1],[-1,1],[1,1]]){
          const s=get(x+ax,y+ay);
          if((s===4||s===8||s===7)&&Math.random()<0.18){ set(x+ax,y+ay,5); life[(y+ay)*W+(x+ax)]=70; }
        }
        life[i]--; if(life[i]<=0){ set(x,y,Math.random()<0.5?6:0); life[i]=50; continue; }
        const up=get(x,y-1);
        if(up===0){ set(x,y,0); set(x,y-1,5); life[(y-1)*W+x]=life[i]; }
      } else if(t===6){                            // smoke
        life[i]--; if(life[i]<=0){ set(x,y,0); continue; }
        const up=get(x,y-1);
        if(up===0){ set(x,y,0); set(x,y-1,6); life[(y-1)*W+x]=life[i]; }
        else { const sx=get(x+side,y); if(sx===0){ set(x,y,0); set(x+side,y,6); life[y*W+x+side]=life[i]; } }
      } else if(t===8){                            // plant grows toward water
        let wet=false;
        for(const [ax,ay] of [[0,1],[-1,0],[1,0],[0,-1],[-1,1],[1,1]]) if(get(x+ax,y+ay)===2) wet=true;
        if(wet&&Math.random()<0.05&&get(x,y-1)===0){ set(x,y-1,8); }
      } else if(t===10){                           // ice
        for(const [ax,ay] of [[0,1],[-1,0],[1,0],[0,-1]]) if(get(x+ax,y+ay)===5||get(x+ax,y+ay)===11){
          if(Math.random()<0.05) set(x,y,2);
        }
      }
    }
  }
}
function draw(){
  const d=img.data; let n=0;
  for(let i=0;i<W*H;i++){
    const c=CMAP[g[i]]||CMAP[0];
    d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;
    if(g[i])n++;
  }
  cx.putImageData(img,0,0);
  $('info').textContent=n+' cells';
}
setInterval(()=>{ if(running) step(); draw(); },33);
</script>
</body>
</html>
