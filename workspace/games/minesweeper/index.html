<!DOCTYPE html>



<html lang="en" class="scroll-smooth">



<head>



<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>Minesweeper | Owen's Workspace</title>



<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">



<script src="https://cdn.tailwindcss.com"></script>



<link rel="preconnect" href="https://fonts.googleapis.com">



<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<script>



tailwind.config = { theme: { extend: {



  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },



  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }



}}};



</script>



<style>



  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }



  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }



  h1,h2,h3 { font-family:'Manrope',sans-serif; }



  .font-mono { font-family:'IBM Plex Sans',monospace; }



  html,body { max-width:100vw; overflow-x:hidden; }



  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;



    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }



  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }



  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }



  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }



  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }



  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem; transition:border-color .2s }



  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }



  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input[type=range] { padding:0; height:1.5rem }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }



  .ws-label { font-family:'IBM Plex Sans',monospace; font-size:9px; font-weight:900; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3) }



  .ws-btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; background:#FF5F1F; padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:#000; cursor:pointer }



  .ws-btn:hover { opacity:.9 }



  .ws-btn-ghost { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); padding:.75rem 1.25rem; font-size:10px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; color:rgba(255,255,255,.5); cursor:pointer }



  .ws-btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,.3) }



  .ws-panel { border-radius:1rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03) }



  .ws-chip { border-radius:9999px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.2rem .6rem; font-size:8px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.35) }



  .ws-out { font-family:'IBM Plex Sans',monospace; white-space:pre-wrap; word-break:break-word; color:rgba(255,255,255,.85); font-size:12.5px; line-height:1.6 }



  .ws-copy { position:relative } .ws-copy.ok::after { content:'COPIED'; position:absolute; right:.75rem; top:.5rem; font-size:8px; font-weight:900; letter-spacing:.2em; color:#4ade80 }



</style>



</head>



<body class="bg-dark text-white selection:bg-secondary selection:text-black">



<div class="noise-overlay"></div>



<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>



<div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-20 pt-8 sm:px-8">



  <div class="mb-8 flex flex-wrap items-center gap-4">



    <a href="/workspace/games/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2 text-[10px] font-black uppercase tracking-[0.22em] text-white/70 hover:text-white transition-colors">



      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Games



    </a>



    <div class="min-w-0">



      <h1 class="truncate font-display text-xl font-extrabold text-white sm:text-2xl">Minesweeper</h1>



      <p class="mt-0.5 text-[10px] font-black uppercase tracking-[0.26em] text-white/40">Game — Client-side</p>



          </div>



          <div class="ml-auto hidden flex-wrap gap-2 sm:flex"><span class="ws-chip">PUZZLE</span><span class="ws-chip">LOGIC</span><span class="ws-chip">LOCAL BEST</span></div>



        </div>



      <section class="ws-panel p-6"><div class="grid gap-6 md:grid-cols-[1fr_240px]"><div id="grid" class="mx-auto grid max-w-[420px] gap-1"></div><div class="flex flex-col gap-4"><div class="rounded-xl border border-white/10 bg-white/[0.04] p-4 text-center"><div class="ws-label mb-1">Mines left</div><div class="font-display text-3xl font-black text-accent" id="left">10</div></div><select id="lvl" class="ws-input"><option value="9,9,10">Easy 9x9</option><option value="12,12,20">Medium 12x12</option><option value="16,16,40">Hard 16x16</option></select><button id="new" class="ws-btn">New game</button><p class="text-[10px] text-white/30 leading-relaxed">Click to reveal, right-click to flag.</p></div></div></section>



  <div id="ws-more" class="mt-12"></div>



  <div class="mt-10 border-t border-white/5 pt-6 text-center">



    <a href="/workspace/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">Owen's Workspace</a>



  </div>



</div>



<script src="/workspace/related.js" defer></script>



<script>const $=id=>document.getElementById(id);



let W,H,M,g,revealed,flags,over;



function reset(){const [w,h,m]=$('lvl').value.split(',').map(Number);W=w;H=h;M=m;



  g=Array(H).fill().map(()=>Array(W).fill(0));revealed=Array(H).fill().map(()=>Array(W).fill(false));



  flags=Array(H).fill().map(()=>Array(W).fill(false));over=false;



  let placed=0;while(placed<M){const r=Math.floor(Math.random()*H),c=Math.floor(Math.random()*W);



    if(g[r][c]!==-1){g[r][c]=-1;placed++}}



  for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(g[r][c]===-1)continue;



    let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;



      if(nr>=0&&nr<H&&nc>=0&&nc<W&&g[nr][nc]===-1)n++}g[r][c]=n}



  $('left').textContent=M;draw()}



function draw(){$('grid').style.gridTemplateColumns='repeat('+W+',1fr)';



  let html='';



  for(let r=0;r<H;r++)for(let c=0;c<W;c++){



    const v=g[r][c],rv=revealed[r][c],fl=flags[r][c];



    let cls='border-white/10 bg-white/[0.05] hover:bg-white/[0.10]',txt='';



    if(rv){cls='border-white/5 bg-white/[0.02]';



      if(v===-1){cls='border-red-500/40 bg-red-500/20';txt='💥'}



      else txt=v||''}



    else if(fl){txt='🚩'}



    const col=v>0&&rv?'color:'+['','#38bdf8','#4ade80','#fbbf24','#fb923c','#f87171','#a78bfa','#f472b6','#e5e7eb'][v]:'';



    html+='<button data-r="'+r+'" data-c="'+c+'" class="flex aspect-square items-center justify-center rounded border font-display text-sm font-black '+cls+'" style="'+col+'">'+txt+'</button>'}



  $('grid').innerHTML=html;



  $('grid').querySelectorAll('button').forEach(b=>{



    b.onclick=()=>reveal(+b.dataset.r,+b.dataset.c);



    b.oncontextmenu=e=>{e.preventDefault();flag(+b.dataset.r,+b.dataset.c)}})}



function reveal(r,c){if(over||revealed[r][c]||flags[r][c])return;revealed[r][c]=true;



  if(g[r][c]===-1){over=true;for(let i=0;i<H;i++)for(let j=0;j<W;j++)revealed[i][j]=true;draw();return}



  if(g[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;



    if(nr>=0&&nr<H&&nc>=0&&nc<W&&!revealed[nr][nc])reveal(nr,nc)}



  draw()}



function flag(r,c){if(over||revealed[r][c])return;flags[r][c]=!flags[r][c];



  $('left').textContent=M-flags.flat().filter(Boolean).length;draw()}



$('new').onclick=reset;$('lvl').onchange=reset;reset();</script>



</body>



</html>
