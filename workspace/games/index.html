<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games | Owen Osayi</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { accent:'#FF5F1F', secondary:'#e0f2fe', dark:'#050505' },
  fontFamily: { sans:['Inter','sans-serif'], display:['Manrope','sans-serif'], mono:['IBM Plex Sans','monospace'] }
}}};
</script>
<style>
  :root { --accent:#FF5F1F; --secondary:#e0f2fe; --dark:#050505; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Manrope',sans-serif; }
  html,body { max-width:100vw; overflow-x:hidden; }
  .noise-overlay { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.015;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .bg-vibrant-blob { position:fixed; width:80vw; height:80vw; filter:blur(140px); z-index:-1; pointer-events:none; }
  @keyframes morph-blob { 0%{transform:translate(0,0) scale(1);opacity:.18} 50%{transform:translate(2vw,-1vh) scale(1.05);opacity:.1} 100%{transform:translate(0,0) scale(1);opacity:.18} }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-track { background:transparent }
  ::-webkit-scrollbar-thumb { background:#1a1a1a; border-radius:10px; border:1px solid rgba(224,242,254,.1) }
  .ws-input { width:100%; border-radius:.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); padding:.9rem 1rem; color:#fff; font-size:.875rem }
  .ws-input:focus { outline:none; border-color:rgba(255,95,31,.5) }
  .ws-input::placeholder { color:rgba(255,255,255,.3) }
  .ws-input[type=number] { min-width:6rem; text-align:right; font-variant-numeric:tabular-nums; padding:.9rem .8rem }
  .ws-input[type=number]::-webkit-outer-spin-button, .ws-input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0 }
  .ws-input[type=number] { -moz-appearance:textfield; appearance:textfield }
  .ws-input option { background-color:#141414 !important; color:#fff !important }
  select.ws-input option:checked { background-color:#FF5F1F !important; color:#000 !important }
</style>
</head>
<body class="bg-dark text-white selection:bg-secondary selection:text-black">
<div class="noise-overlay"></div>
<div class="bg-vibrant-blob bg-secondary/20 top-[-30%] left-[-10%]" style="animation:morph-blob 20s infinite alternate linear"></div>
<header class="sticky top-0 z-40 border-b border-white/5 bg-[#050505]/85 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-6">
    <a href="/" class="flex items-center gap-4 group text-left">
      <span class="h-10 w-3.5 rounded-full bg-accent shadow-[0_0_20px_rgba(255,95,31,0.5)] transition-transform group-hover:scale-110"></span>
      <span class="flex flex-col justify-center">
        <span class="text-sm font-black tracking-widest text-white leading-none">OWEN OSAYI</span>
        <span class="text-[10px] font-medium tracking-wider text-white/50 uppercase mt-1">THE FOUNDER</span>
      </span>
    </a>
    <nav class="hidden md:flex items-center gap-10 text-sm font-bold tracking-wide">
      <a href="/workspace/tools/" class="text-white/60 hover:text-white transition-colors">Tools</a>
      <a href="/workspace/games/" class="text-accent font-black">Games</a>
      <a href="/workspace/websites/" class="text-white/60 hover:text-white transition-colors">Websites</a>
      <a href="#" data-ocurp-account class="text-white/60 hover:text-white transition-colors">Sign In</a>
    </nav>
    <a href="/ocurp/signin/" class="flex h-12 items-center justify-center rounded-full bg-accent px-8 text-[11px] font-black uppercase tracking-widest text-black shadow-lg hover:opacity-90 transition-opacity">Initiate</a>
  </div>
</header>
<main class="relative z-10">
  <section class="relative overflow-hidden py-16 md:py-20">
    <div class="pointer-events-none relative mx-auto mb-2 h-[200px] w-[200px] opacity-80 sm:h-[240px] sm:w-[240px] md:absolute md:-right-16 md:-top-12 md:mb-0 md:h-[360px] md:w-[360px] lg:right-0 lg:h-[440px] lg:w-[440px]">
      <canvas id="ws-3d" data-shape="torus" class="h-full w-full"></canvas>
    </div>
    <div class="relative mx-auto max-w-7xl px-4 md:px-6">
      <div class="inline-flex items-center gap-3 mb-4">
        <span class="h-1.5 w-1.5 rounded-full bg-accent animate-pulse"></span>
        <span class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.5em] text-accent">Owen's Arcade</span>
      </div>
      <h1 class="font-display text-4xl md:text-7xl font-black text-white tracking-tighter leading-none">Games for <span class="text-accent">downtime</span></h1>
      <p class="mt-6 max-w-2xl text-lg md:text-xl text-white/50 leading-relaxed font-medium">Quick games that run in the tab. Scores and streaks stay in this browser.</p>
    </div>
  </section>
  <section class="pb-24">
    <div class="mx-auto max-w-7xl px-4 md:px-6">
      <div class="mb-10 flex flex-col gap-6">
        <div class="relative max-w-xl">
          <input id="ws-search" type="text" placeholder="Search…" class="ws-input">
        </div>
        <div id="ws-cats" class="flex flex-wrap gap-2"></div>
      </div>
      <p id="ws-count" class="mb-6 text-[10px] font-black uppercase tracking-[0.3em] text-white/30"></p>
      <div id="ws-grid" class="grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 xl:grid-cols-4"></div>
      <div id="ws-empty" class="hidden rounded-2xl border border-white/5 bg-white/[0.03] px-6 py-12 text-center">
        <p class="font-display text-xl font-bold text-white">Nothing matches that</p>
        <p class="mt-2 text-sm text-white/50">Try a different word, or browse a category instead.</p>
      </div>
    </div>
  </section>
</main>
<footer class="relative border-t border-white/10 py-10">
  <div class="mx-auto max-w-7xl px-4 md:px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-white/40 font-mono">
    <p>© <span id="ws-year"></span> <span class="text-white/60 font-bold">Owen Osayi</span> THE FOUNDER</p>
    <div class="flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-accent animate-pulse"></span>
      <span class="text-[10px] uppercase tracking-widest font-black">All systems operational</span>
    </div>
  </div>
</footer>
<script src="/workspace/games-data.js"></script>
<script src="/workspace/listing.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="/workspace/supabase-config.js" defer></script>
<script src="/workspace/auth.js" defer></script>
<script src="/workspace/hero3d.js" defer></script>
</body>
</html>
