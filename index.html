    <script>
      /* Scroll-reveal, with a hard guarantee that content is never left hidden.

         The failure this fixes: the observer only ever fires for a node that
         INTERSECTS. With `visibility:hidden` on .reveal, a fast scroll, a
         keyboard jump, an anchor link, or a restored scroll position left whole
         sections invisible and unclickable -- the user saw the page but could
         not click anything in it.

         Two belts to that braces:
           1. .reveal no longer sets visibility:hidden, so an unrevealed block
              is at worst still transparent, never unclickable.
           2. a sweep that force-reveals anything still hidden after 1.2s and
              whenever the page is restored, so the observer missing is a lost
              animation and never lost content. */
      const revealAll = () => document.querySelectorAll('.reveal:not(.active)')
        .forEach(el => el.classList.add('active'));

      if (typeof IntersectionObserver === 'function') {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

        const setupObserver = () => {
          document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupObserver);
        } else {
          setupObserver();
        }

        // Re-observe dynamically added elements
        const mutationObserver = new MutationObserver((mutations) => {
          mutations.forEach(mutation => {
            mutation.addedNodes.forEach(node => {
              if (node.nodeType === 1 && node.classList.contains('reveal')) {
                observer.observe(node);
              } else if (node.nodeType === 1) {
                node.querySelectorAll('.reveal').forEach(el => observer.observe(el));
              }
            });
          });
        });
        mutationObserver.observe(document.body, { childList: true, subtree: true });
      } else {
        // no observer support: show everything rather than hide the page
        document.documentElement.classList.add('no-js');
      }

      /* the safety net */
      setTimeout(revealAll, 1200);
      window.addEventListener('load', () => setTimeout(revealAll, 400));
      window.addEventListener('pageshow', revealAll);   // bfcache / back-forward restore
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
